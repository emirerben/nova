\* Safety rules the fixed code keeps (verify.py "one-save-all-events"); open in the TLA+
\* Toolbox or run with tlc2.TLC. verify.py runs every rule in its MODEL_RUNS / FULL_RUNS and
\* checks each one's teeth; a cfg holds one SPECIFICATION, so liveness lives there.
SPECIFICATION Spec
CONSTANTS
  MaxFaults = 1
  MaxSaves = 1
  MaxTicks = 1
  MaxId = 3
  Conds = {"none", "hot", "missing"}
  Approvals = {FALSE}
  Chat = {TRUE}
  Events = {"save", "other", "stop", "kill", "background", "reaper", "sync"}
INVARIANT NoStalePublish
INVARIANT PublishedStaysPublished
INVARIANT SyncedMeansPublished
INVARIANT NoStaleRequestReinstalled
INVARIANT CloudDecisionReported
INVARIANT NoSpuriousAttention
INVARIANT NoFutileRepin
INVARIANT UpdateTold
INVARIANT NoRepinLoop
