\* Safety rules the fixed code keeps (verify.py "one-save-all-events"). An unsupported
\* recipe is left out here: NoSpuriousAttention still breaks there (PhoneRenderFindings.cfg).
\* The liveness rules (AttentionHasWayOut, PreviewConverges, ClientServerAgree) run in
\* verify.py's live-* and agree runs; a cfg holds one SPECIFICATION.
SPECIFICATION Spec
CONSTANTS
  MaxFaults = 1
  MaxSaves = 1
  MaxTicks = 1
  MaxId = 3
  Conds = {"none", "hot", "missing"}
  Approvals = {FALSE}
  Events = {"save", "other", "stop", "kill", "background", "reaper", "sync"}
INVARIANT NoStalePublish
INVARIANT PublishedStaysPublished
INVARIANT SyncedMeansPublished
INVARIANT NoStaleRequestReinstalled
INVARIANT CloudDecisionReported
INVARIANT NoSpuriousAttention
