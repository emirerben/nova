  },
  "openapi": "3.0.3",
  "paths": {
    "/auth/mobile/exchange": {
      "post": {
        "operationId": "exchangeMobileIdentity",
        "requestBody": {
          "content": {
            "application/json": {
              "schema": {
                "$ref": "#/components/schemas/MobileExchangeRequest"
              }
            }
          },
          "required": true
        },
        "responses": {
          "200": {
            "content": {
              "application/json": {
                "schema": {
                  "$ref": "#/components/schemas/MobileSessionOut"
                }
              }
            },
            "description": "Success"
          },
          "401": {
            "description": "Authentication required"
          },
          "409": {
            "description": "Revision or identity conflict"
          },
          "422": {
            "description": "Invalid request"
          }
        }
