            "title": "Mode",
            "type": "string"
          },
          "move_duration_s": {
            "default": null,
            "nullable": true,
            "title": "Move Duration S",
            "type": "number"
          },
          "position": {
            "default": null,
            "nullable": true,
            "title": "Position",
            "type": "string"
          },
          "sequence": {
            "default": null,
            "items": {
              "additionalProperties": true,
              "type": "object"
            },
            "nullable": true,
            "title": "Sequence",
            "type": "array"
          },
          "timing_model": {
            "default": null,
            "nullable": true,
            "title": "Timing Model",
            "type": "string"
          },
          "transition": {
