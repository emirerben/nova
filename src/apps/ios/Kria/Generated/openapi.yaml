      "CarouselMomentEditRequest": {
        "additionalProperties": false,
        "description": "Partial carousel-moment config for the carousel editor panel.\n\nAll fields optional \u2014 an omitted field keeps the variant's persisted\nvalue; the top-level `EditVariantRequest.carousel_moment` itself is what\ncarries the absent/null/dict tri-state (see `dispatch_edit_variant`):\nomitting `carousel_moment` entirely leaves the moment unchanged, an\nexplicit top-level `null` removes it, and a `CarouselMomentEditRequest`\nbody here partial-merges over whatever's persisted (present keys win,\nabsent keys keep). Enum/range validation happens in\n`dispatch_edit_variant`, matching every other loosely-typed field on\n`EditVariantRequest` (font_family, effect, text_color, ...).",
        "properties": {
          "duration_s": {
            "default": null,
            "nullable": true,
            "title": "Duration S",
            "type": "number"
          },
          "effect": {
            "default": null,
            "nullable": true,
            "title": "Effect",
            "type": "string"
          },
