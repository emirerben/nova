name: Kria
options:
  minimumXcodeGenVersion: 2.38.0
  deploymentTarget:
    iOS: "18.0"
  groupSortPosition: top
  createIntermediateGroups: true
  developmentLanguage: en
configs:
  Debug: debug
  Live Development: debug
  Staging: debug
  Release: release
configFiles:
  Debug: Config/Development.xcconfig
  Live Development: Config/LiveDevelopment.xcconfig
  Staging: Config/Staging.xcconfig
  Release: Config/Production.xcconfig
packages:
  KriaMediaEngine:
    path: Packages/KriaMediaEngine
  SwiftOpenAPIGenerator:
    url: https://github.com/apple/swift-openapi-generator
    exactVersion: 1.13.1
  SwiftOpenAPIRuntime:
    url: https://github.com/apple/swift-openapi-runtime
    exactVersion: 1.12.1
  SwiftOpenAPIURLSession:
    url: https://github.com/apple/swift-openapi-urlsession
    exactVersion: 1.3.1
settings:
  base:
    SWIFT_VERSION: 6.0
    DEVELOPMENT_TEAM: "$(KRIA_DEVELOPMENT_TEAM)"
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_EMIT_LOC_STRINGS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG DEV_AUTH"
    Live Development:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: "DEBUG LIVE_GOOGLE_ONLY"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
targets:
  Kria:
    type: application
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Kria
      - path: ../api/assets/fonts
        type: folder
        buildPhase: resources
      - path: ../web/public/fonts/Fraunces-Bold.ttf
        buildPhase: resources
      - path: ../web/public/fonts/Inter-Regular.ttf
        buildPhase: resources
      - path: ../web/public/fonts/Inter-Medium.ttf
        buildPhase: resources
      - path: ../web/public/fonts/Inter-Bold.ttf
        buildPhase: resources
      - path: ../web/public/plan/type-posters/montage.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/montage.mp4
        buildPhase: resources
      - path: ../web/public/plan/type-posters/voiceover.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/broll.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/talking.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/slider-lisbon-taberna-1.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/slider-lisbon-taberna-2.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/slider-lisbon-taberna-3.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/slider-lisbon-taberna-4.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/slider-lisbon-taberna-5.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/slider-lisbon-taberna-6.jpg
        buildPhase: resources
      - path: ../web/public/plan/type-posters/slider-lisbon-taberna-7.jpg
        buildPhase: resources
      - path: ../web/public/landing/raw-story/trulli-street.jpg
        buildPhase: resources
      - path: ../web/public/landing/raw-story/istanbul.mp4
        buildPhase: resources
      - path: ../web/public/landing/raw-story/lisbon.jpg
        buildPhase: resources
    dependencies:
      - package: KriaMediaEngine
        product: KriaMediaEngine
      - package: SwiftOpenAPIRuntime
        product: OpenAPIRuntime
      - package: SwiftOpenAPIURLSession
        product: OpenAPIURLSession
    buildToolPlugins:
      - plugin: OpenAPIGenerator
        package: SwiftOpenAPIGenerator
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(KRIA_PRODUCT_BUNDLE_IDENTIFIER)"
        PRODUCT_NAME: Kria
        INFOPLIST_FILE: Kria/Support/Info.plist
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_ENTITLEMENTS: Kria/Kria.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_STRICT_CONCURRENCY: complete
      configs:
        Live Development:
          CODE_SIGN_ENTITLEMENTS: "$(KRIA_LIVE_DEVELOPMENT_ENTITLEMENTS)"
        Staging:
          PRODUCT_BUNDLE_IDENTIFIER: "$(KRIA_PRODUCT_BUNDLE_IDENTIFIER)"
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: "$(KRIA_PRODUCT_BUNDLE_IDENTIFIER)"
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: Apple Distribution
          PROVISIONING_PROFILE_SPECIFIER: "$(KRIA_PROVISIONING_PROFILE_SPECIFIER)"
    scheme:
      testTargets:
        - KriaTests
        - KriaUITests
      gatherCoverageData: true
  KriaTests:
    type: bundle.unit-test
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/KriaTests
      - path: Tests/Fixtures/editor-commit-picker-contract.json
        buildPhase: resources
      - path: Tests/Fixtures/guided_label_rebase_vectors.json
        buildPhase: resources
      - path: Tests/Fixtures/editor_save_matrix.json
        buildPhase: resources
      - path: Tests/Fixtures/editor_save_codes.json
        buildPhase: resources
      - path: Tests/Fixtures/speech_editor_projection.json
        buildPhase: resources
    dependencies:
      - target: Kria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emirerben.kria.tests
        GENERATE_INFOPLIST_FILE: YES
  KriaUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/KriaUITests
    dependencies:
      - target: Kria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emirerben.kria.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kria
  KriaPerfUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/KriaPerfUITests
    dependencies:
      - target: Kria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.emirerben.kria.perftests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kria
  KriaHardwareUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "18.0"
    sources:
      - path: Tests/KriaHardwareUITests
    dependencies:
      - target: Kria
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kria.teleprompter.hardware-tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Kria
schemes:
  # Performance benchmarks (`scripts/ios/bench.sh`). Its own scheme so coverage instrumentation, which inflates
  # every timing, never applies, and so CI's Kria scheme (verify.sh) does not run these.
  Kria Perf:
    build:
      targets:
        Kria: all
        KriaPerfUITests: [test]
    test:
      config: Debug
      gatherCoverageData: false
      targets:
        - KriaPerfUITests
  Kria Hardware QA:
    build:
      targets:
        Kria: all
        KriaHardwareUITests: [test]
    test:
      config: Debug
      targets:
        - KriaHardwareUITests
  Kria Live Development:
    build:
      targets:
        Kria: all
    run:
      config: Live Development
    profile:
      config: Live Development
    analyze:
      config: Live Development

  Kria Production SignIn Check:
    build:
      targets:
        Kria: all
        KriaUITests: [test]
    run:
      config: Release
    test:
      config: Release
      gatherCoverageData: false
      targets:
        - name: KriaUITests
          selectedTests:
            - ProductionSignInUITests/testBuildControlsDevelopmentSignIn
