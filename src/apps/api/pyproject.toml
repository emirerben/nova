[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nova-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    # 5.5 introduced worker_soft_shutdown_timeout, which the Fly deploy-stop
    # policy relies on to restore late-acknowledged renders before hard stop.
    "celery[redis]>=5.5",
    "redis>=5.0",
    # 2.1 made psycopg (v3) the default driver for plain postgresql:// URLs.
    # The sync engine (app/database.py) and alembic use such URLs with
    # psycopg2-binary, so 2.1 fails at import with "No module named
    # 'psycopg'" (CI broke on 2026-09-24, minutes after 2.1.0 shipped). Move
    # to 2.1 deliberately: switch the drivers and re-verify.
    "sqlalchemy>=2.0,<2.1",
    # SQLAlchemy's async runtime needs greenlet. Without it, anything that
    # routes through AsyncSession (alembic env.py async runner, app routes,
    # workers) crashes with "the greenlet library is required to use this
    # function". Pip pulls greenlet transitively when wheels are installed on
    # platforms it ships them for, but the dep is not declared anywhere — fresh
    # venvs on macOS arm64 have hit this exact failure twice. Pin it explicitly.
    "greenlet>=3.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg2-binary>=2.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.2",
    "openai>=2.44,<3",
    "anthropic>=0.116,<1",
    # Per-request retry/deadline contracts are qualified against SDK 2.10.
    "google-genai>=2.10,<3",
    "google-cloud-storage>=2.16",
    "google-cloud-vision>=3.7",
    # One OpenCV distribution. opencv-python, -headless, -contrib-python and
    # -contrib-python-headless all unpack into the same `cv2/` directory and no
    # installer knows they overlap, so with two installed the last one written
    # decides which `cv2` loads. It is contrib because mediapipe requires that
    # one by name and only it has `cv2.CascadeClassifier` in OpenCV 5 (face
    # sampler, thumbnails). scenedetect requires `opencv-python`; it runs on
    # this `cv2`, and that requirement is left out:
    # - uv (CI, the lock): `[tool.uv] exclude-dependencies` below;
    # - pip (the production image, a few workflows, `make api-install-dev`):
    #   pip cannot leave a requirement out, so each runs
    #   `scripts/ci/opencv-install.py --only opencv-contrib-python` afterwards.
    # Guards: scripts/ci/test_api_lock.py, and docker-build.yml on the image.
    "scenedetect>=0.6",
    "opencv-contrib-python>=4.9",
    "cryptography>=42",
    "slowapi>=0.1.9",
    "email-validator>=2.1",
    "python-multipart>=0.0.9",
    "httpx[http2]>=0.27",
    "websockets>=16,<17",
    "structlog>=24",
    "Pillow>=10.0",
    "pillow-heif>=0.16",
    # Skia text renderer for agentic templates + music lyrics
    # (app.pipeline.text_overlay_skia). Classic non-music + non-agentic
    # templates remain on Pillow + libass. Wheel is ~50MB; skia-python
    # ships pre-built binaries for linux + darwin amd64/arm64.
    "skia-python>=87,<200",
    "yt-dlp[default]>=2024.12",
    # numpy is a transitive of opencv-contrib-python / scenedetect, but the
    # font-identification pipeline depends on it directly for embedding math.
    # Pinning explicitly so the resolver can't silently downgrade it.
    "numpy>=1.26",
    # CLIP image embeddings for the font-identification pipeline. Torch itself
    # is installed earlier in the Dockerfile from the CPU-only index, so this
    # entry must NOT trigger a torch reinstall — `open-clip-torch` declares
    # `torch` as a runtime dep and pip will see it already satisfied.
    # Tight floor on 3.x because the registry-embeddings.npz artifact was
    # produced against open-clip 3.x; a 2.x downgrade would change the
    # preprocess pipeline and silently misalign query embeddings from the
    # registry (the model_version check catches this but only at first call).
    "open-clip-torch>=3.3,<4",
    # Lightweight JSON repair library used by the agent runtime to salvage
    # malformed Gemini output (truncated braces, stray commas) BEFORE
    # declaring `terminal_refusal`. Opted in per-agent via
    # `AgentSpec.enable_json_repair`. Pure-Python, ~50KB, MIT.
    "json-repair>=0.30",
    # Canonical motion-scene contract validation. The same checked-in JSON
    # Schema is consumed by the API and exercised by the TypeScript runtime.
    "jsonschema>=4.23,<5",
    # ImageSegmenter (selfie segmenter, VIDEO mode) for the subject-matte
    # occlusion engine (app.pipeline.subject_matte). Imported LAZILY inside
    # subject_matte.py functions so the module stays importable without it
    # (structural eval-CI constraint) and any matte failure degrades to
    # None instead of breaking a render job.
    #
    # mediapipe requires `opencv-contrib-python` by name, which is why that is
    # the project's one OpenCV distribution (see `opencv-contrib-python` above).
    # It is the GUI-linked build; the prod Dockerfile installs
    # libgl1/libegl1/libglib2.0-0, which it needs to import.
    "mediapipe>=0.10,<0.11",
    # onnxruntime CPU for the RobustVideoMatting subject-matte backbone
    # (app.pipeline.subject_matte, MATTE_RVM_ENABLED). Imported LAZILY like
    # mediapipe above; pure-CPU provider, no GL/system deps. Model asset:
    # assets/models/rvm_mobilenetv3_fp32.onnx (~15MB, committed like the
    # selfie segmenter tflite).
    "onnxruntime>=1.17,<2",
    # Unicode 17 grapheme boundaries match the native text-motion oracle.
    # Qualify upgrades against Python and Swift timing before changing this pin.
    "regex==2026.6.28",
    # Admin-only edit-training exports. JSONL and Parquet share one canonical
    # schema; pyarrow is imported lazily so normal API/render paths pay no
    # startup cost. Keep a bounded major range for reproducible writer output.
    "pyarrow>=17,<22",
]

[project.optional-dependencies]
# Speech-cleanup filler check: forced alignment with facebook/wav2vec2-base-960h on the torch the
# Dockerfile installs from the CPU index. The prod image installs this extra and bakes the model;
# elsewhere app/pipeline/speech_cleanup_alignment.py raises AlignerUnavailable and cleanup keeps
# whisper's word stamps.
speech-align = [
    "transformers>=4.46,<6",
]
local-whisper = [
    "faster-whisper>=1.0",
]
# Local-dev OCR backend (macOS Vision via pyobjc). Cannot run on Fly's
# Linux containers; pinned to a separate extra so prod builds never see it.
# `pip install -e '.[dev-ocr]'` on macOS for eval / local debugging.
dev-ocr = [
    "pyobjc-framework-Vision>=10; platform_system == 'Darwin'",
    "pyobjc-framework-Quartz>=10; platform_system == 'Darwin'",
]
observability = [
    # Langfuse traces every Agent.run() when LANGFUSE_PUBLIC_KEY +
    # LANGFUSE_SECRET_KEY are set. Optional — runtime fails open without it.
    # See app/agents/_langfuse.py + OBSERVABILITY.md.
    # Pinned to v2 because the self-hosted Langfuse server in
    # docker-compose.langfuse.yml is v2 — and the v4 SDK is incompatible
    # (OpenTelemetry-based, talks to endpoints the v2 server doesn't have).
    # When upgrading the server to v3+, bump this to "langfuse>=3,<5" and
    # rewrite app/agents/_langfuse.py to the new context-manager API.
    "langfuse>=2,<3",
    # Anthropic SDK powers the online-eval LLM judge (Claude Sonnet). Only
    # invoked when NOVA_ONLINE_EVAL_SAMPLE_RATE > 0 + ANTHROPIC_API_KEY set.
    # Sampled fraction of prod traces gets scored against tests/evals/rubrics/.
    "anthropic>=0.116,<1",
]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "pytest-mock>=3.14",
    "pytest-xdist>=3",
    "pytest-timeout>=2.3",
    "httpx>=0.27",
    "aiosqlite>=0.20",
    # Exact: two ruff versions format differently, and CI and laptops must agree
    # (scripts/ci/api-lint.py refuses any other version).
    "ruff==0.17.6",
    "mypy>=1.10",
    "fonttools>=4.53",
    "anthropic>=0.116,<1",
]
analysis = [
    # Offline analyzer scripts under scripts/overlay_forensics/ and
    # scripts/analyze_waka_waka_diff.py. Tesseract binary is the runtime
    # requirement (brew install tesseract / apt-get install tesseract-ocr).
    # NOT shipped to prod — analyzer is dev-only.
    "pytesseract>=0.3.10",
]

[dependency-groups]
# CI and local `uv sync` take torch from the CPU-only index, as the Dockerfile
# does. torch is only a transitive dependency (open-clip-torch), and uv applies
# an index source to direct dependencies only, so it is named here. Without
# this the default index serves the CUDA build: about 2 GB of nvidia wheels
# that no CI job can use.
cpu-torch = [
    "torch>=2.4,<3",
    "torchvision<1",
]

[tool.uv]
# The OpenCV distributions the project does not use; see `opencv-contrib-python`
# in [project] dependencies. scenedetect requires the first by name.
exclude-dependencies = [
    "opencv-python",
    "opencv-python-headless",
    "opencv-contrib-python-headless",
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]
torchvision = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[tool.setuptools.packages.find]
where = ["."]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.format]
# Not formatted yet, and this list only shrinks (scripts/ci/test_api_lint.py).
# These pipeline files belong to no test journey, and CI refuses a change to an
# unclaimed pipeline file, so a formatting-only change cannot touch them. When
# you change one: add it to a journey, format it, and delete its line here.
exclude = [
    "app/pipeline/audio_layout.py",
    "app/pipeline/intro_voiceover_mix.py",
    "app/pipeline/lyric_support.py",
    "app/pipeline/orientation.py",
    "app/pipeline/prompt_loader.py",
    "app/pipeline/scene_detect.py",
    "app/pipeline/text_overlay_v2/tokenize.py",
    "app/pipeline/text_wrap.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
"app/pipeline/captions.py" = ["E501"]  # ASS subtitle format strings must stay on one line
"scripts/build_eval_dashboard.py" = ["E501"]  # large inline CSS/HTML/JS string literals
"scripts/diff_lyric_sync.py" = ["E501"]  # large inline HTML/CSS report template strings

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
timeout = 30
required_plugins = ["pytest-timeout>=2.3"]
markers = [
    "needs_git_history: asks git about commits older than HEAD; skips on a one-commit clone and must pass in the CI job that has full history (scripts/ci/api-tests.py history)",
    "journey(id, step=None): file belongs to a journey in scripts/ci/journey-manifest.json; step names the ci.yml step that runs it (scripts/ci/journey_registry.py)",
]
