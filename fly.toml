# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "nova-video"
primary_region = "iad"

# NOTE: kill_timeout is intentionally NOT set at the top level — Fly applies
# the top-level value to the release_command machine too, and as of 2026-05-09
# Fly caps stop_config.timeout at 5m server-side ("invalid stop_config.timeout,
# cannot exceed 5 minutes"). Setting it here at 30m breaks deploys.
# Instead, the 30m drain budget is set per-process in the [[vm]] sections
# below — api and worker both get 30m, the release_command machine uses
# Fly's default (which fits the new 5m cap).
# Why we want 30m for workers: orchestrate_template_job has an 1800s hard
# timeout, so 30m gives any almost-done FFmpeg run room to finish on deploy
# instead of being SIGKILL'd and leaving jobs orphaned in status=processing.

[build]
  dockerfile = "Dockerfile"

[deploy]
  release_command = "python -m alembic upgrade head"

# ---------------------------------------------------------------------------
# Process groups
# ---------------------------------------------------------------------------

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  # concurrency=1: shared-CPU workers shouldn't multiplex video encode tasks.
  # With concurrency=2 each task fights another for the 2 shared CPUs, so a
  # 14s local curtain-close encode ballooned to >600s in prod (job d018d1c3
  # post-PR #103). One task per worker means each task gets the full CPU
  # allocation. Trade-off: half the parallel throughput, but each render
  # completes in roughly a quarter of the wall-clock.
  # -Q celery,plan-jobs: also drain the content-plan render queue. Per-item plan
  # renders (generate_plan_item_videos → orchestrate_generative_job) are routed to
  # `plan-jobs` so generate-first-week can enqueue 7 at once; the single
  # concurrency=1 slot serializes them, so they can never run simultaneously and
  # OOM the 6GB worker (plan T3). One worker, two queues, still one task at a time.
  worker = "celery -A app.worker worker --loglevel=info --concurrency=1 -Q celery,plan-jobs,overlay-jobs"
  # 2026-08-02 (render-worker autostop): moves ALL Beat-triggered tasks
  # (sweep_stale_jobs, cleanup_agent_runs, send_daily_digest,
  # cleanup_cancelled_job, and every app.tasks.tiktok.* periodic — see
  # `task_routes` in app/worker.py) off the `worker` process onto this
  # small, always-on machine. Without this split, the `worker` machine can
  # never sit idle for more than a few minutes (the 5-min sweeper alone
  # guarantees it), which defeats the whole point of scaling it to zero
  # when RENDER_AUTOSTOP_ENABLED is on. concurrency=2: these are quick,
  # light, non-FFmpeg tasks — no encode-contention concern like the worker
  # process has.
  light = "celery -A app.worker worker --loglevel=info --concurrency=2 -Q maintenance"
  # Celery Beat — single instance, drives the every-5-min stale-job
  # sweeper (app/tasks/maintenance.py) that catches orphans created when
  # autoretry budgets are exhausted AND _mark_failed itself failed.
  # MUST remain a single process group with one machine — Beat doesn't
  # de-duplicate across replicas. See [[vm]] below for the small VM.
  beat = "celery -A app.worker beat --loglevel=info"

# ---------------------------------------------------------------------------
# HTTP service (api process only)
# ---------------------------------------------------------------------------

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["api"]
  # auto_stop_machines + min_machines_running = 1 prevents the proxy's
  # autostopper from racing rolling deploys. With a single api replica and
  # no floor, the proxy autostops the machine ~10s after flyctl takes its
  # lease — leaving a "stopped with new image" machine that nothing
  # restarts until the orchestrator's 5m poll times out and red-marks an
  # otherwise-successful deploy. Canonical trace:
  # https://github.com/emirerben/nova/actions/runs/26036712549 (PR #217).
  # Floor of 1 makes autostop a no-op for current single-replica prod and
  # still trims to 1 if we ever add a second api machine.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = 15000        # ms
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = 5000          # ms

# ---------------------------------------------------------------------------
# Worker — always running, no HTTP exposure
# ---------------------------------------------------------------------------

[[services]]
  processes = ["worker"]
  auto_stop_machines = false
  auto_start_machines = true

# ---------------------------------------------------------------------------
# Light — always running, no HTTP exposure. Carries the Beat-triggered
# maintenance tasks so the worker machine above can sit stopped when
# RENDER_AUTOSTOP_ENABLED is on. This machine must NEVER be allowed to sit
# idle-stopped itself — it's what wakes the worker back up, both via the
# app-level wake hook (which fires from wherever a task is dispatched, not
# necessarily this machine) and the periodic lifecycle backstop task that
# runs HERE. See agents/DECISIONS.md for the render-worker autostop design
# and its Beat-liveness failure mode.
# ---------------------------------------------------------------------------

[[services]]
  processes = ["light"]
  auto_stop_machines = false
  auto_start_machines = true

# ---------------------------------------------------------------------------
# VM sizing per process group
# ---------------------------------------------------------------------------

[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  # 2026-05-18: 512 → 2048. Kernel OOM-killed uvicorn during a 4-concurrent
  # clip_prefetch burst (template 7b4a98d5…, batch-9774726a9e3d). Log:
  #   "Out of memory: Killed process 636 (uvicorn) total-vm:900984kB"
  # The Semaphore(4) in app/services/clip_prefetch.py was sized against
  # the 512MB budget but didn't account for /tmp being tmpfs on Firecracker
  # — each in-flight clip's tempfile.TemporaryDirectory() counts against
  # RAM. 2048MB covers the observed ~900MB peak with ~1.1GB headroom so
  # larger clip batches (longer/higher-bitrate footage, future workloads)
  # don't push us back into OOM territory. If we ever see OOMs at 2048
  # the structural fix is moving clip_prefetch off the api process onto
  # the worker pool (which has 6144MB).
  memory_mb = 2048
  kill_timeout = "30m"

# Beat — tiny VM, schedules periodic tasks (no real CPU/memory needs).
# Keep at 1 machine; Beat schedule de-duplication across replicas is not
# trivial and we don't need it for a single 5-min sweeper.
[[vm]]
  processes = ["beat"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 256

# Light — small always-on VM for the Beat-triggered maintenance tasks
# (see task_routes in app/worker.py). 512MB, not the 256MB beat/api-minimum
# tier: cleanup_agent_runs runs batched DELETEs against a table that can
# grow into the hundreds of thousands of rows, and concurrency=2 means two
# of these light tasks can run at once. Deliberately does NOT host any
# task that downloads media or loads torch (match_pool_clips,
# style_vision_build.*, drive_import.*, agentic_template_build_task,
# analyze_music_track_task all stay on the render worker) — those would
# OOM this VM.
[[vm]]
  processes = ["light"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 512

[[vm]]
  processes = ["worker"]
  # 2026-08-02, second change same day: shared → performance (re-reverted).
  # Earlier today this was downsized from performance-4x/8192MB to
  # shared-cpu-4x/6144MB as a cost cut, on the reasoning that the ONLY
  # justification for the 2026-06-13 performance upgrade was
  # GENERATIVE_PARALLEL_VARIANTS_ENABLED (never flipped on). That reasoning
  # missed the upgrade's OTHER stated justification — "shared cores are
  # oversubscribed/throttled, so every FFmpeg encode + the Skia per-frame PNG
  # render runs slower than the vCPU count suggests" — which was providing
  # real value the whole time, independent of parallelism.
  #
  # Confirmed in prod within ~50 min of the downsize deploying: job
  # 6bdb58dc-5933-4e82-b55c-ba2de00da19c (a `subtitled`-archetype render)
  # failed when its Skia PNG-sequence overlay burn
  # (text_overlay_skia.py:2025, subprocess timeout=600s) exceeded 600s and
  # was killed. This was the FIRST render dispatched after the downsize
  # deployed. Root-cause confidence is high (mechanism, timing, and the
  # documented pre-existing claim about this exact workload all line up)
  # but not proven with a controlled before/after rerun of the identical
  # input — Fly's shared-vCPU throttling happens at the hypervisor level,
  # invisible from inside the guest.
  #
  # Reverting immediately rather than waiting for more data: a failed
  # render is a real user-visible cost (a lost video), and the $122/mo the
  # downsize was saving is not worth trading for unreliable renders while
  # more evidence accumulates. This VM class stays performance-4x until
  # RENDER_AUTOSTOP_ENABLED is verified live in prod — at that point the
  # worker's active hours drop enough that performance-4x costs nearly the
  # same as shared-cpu-4x (Phase 3 of the scale-to-zero plan), so there is
  # no future need to revisit this specific tradeoff. See agents/DECISIONS.md.
  cpu_kind = "performance"
  cpus = 4
  # 8192MB — the 2026-06-13 sizing this reverts back to. 4096 → 6144 history
  # (admin-test job 022a00e4-7926-4d82-b248-16431dec543b OOM at FFmpeg
  # anon-rss 1897MB/total-vm 3596MB on a minimal single-pass spec) still
  # applies; 6144 → 8192 added headroom for the 2-way parallel-variant
  # render (still unused) plus the CLIP font-matcher singleton. Keeping
  # 8192 rather than dropping back to 6144 avoids re-litigating that
  # headroom math while this VM class question is already being revisited
  # under incident pressure.
  memory_mb = 8192
  kill_timeout = "30m"
  # SIGTERM (not Fly's SIGINT default) is Celery's clean warm-shutdown signal:
  # the worker stops consuming new tasks and lets the in-flight task finish
  # before exiting. Paired with the 30m kill_timeout above, a deploy then gives
  # a long render (e.g. a multi-clip generative job) a chance to complete and
  # persist rather than being cut off mid-variant. This is best-effort drain;
  # the hard guarantee against deploy/OOM kills is the resumable-variant logic
  # in orchestrate_generative_job (each variant is persisted as it finishes and
  # reused on the acks_late retry) plus the reaper (#326) clearing any row a
  # SIGKILL still strands.
  kill_signal = "SIGTERM"
