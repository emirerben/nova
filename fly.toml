# See https://fly.io/docs/reference/configuration/ for information about how to use this file.

app = "nova-video"
primary_region = "iad"
kill_signal = "SIGTERM"
kill_timeout = 300

# Fly caps the machine stop timeout at five minutes. Remapping TERM to QUIT
# lets Celery spend up to four of those minutes in soft shutdown, then restore any
# unfinished late-acknowledged task with a one-minute margin before hard stop.
[env]
  # REMAP_SIGTERM is read by the Celery worker process itself (a Celery 5.5
  # soft-shutdown feature) — not by Fly's init. It's inert on any non-Celery
  # process, including the temporary release_command machine that inherits
  # this env block. It is NOT the cause of the intermittent release-machine
  # kills tracked in issue #834: those exit with code 143 (128+15 = plain
  # SIGTERM); a SIGQUIT death from a remap would instead be 131. Root cause
  # is a Fly platform-side machine lifecycle race — see agents/DECISIONS.md
  # (2026-08-17) and scripts/fly-deploy-with-retry.sh, which retries that
  # specific signature once.
  REMAP_SIGTERM = "SIGQUIT"
  # Poster extraction downloads MP4s; route it to the media-capable worker.
  # Enable POSTER_ONDEMAND_REPAIR_ENABLED only after all workers are upgraded.
  POSTER_REPAIR_QUEUE = "autoplace-jobs"
  # Intent-review evidence downloads the published MP4 and runs ffmpeg: it belongs on the
  # worker machine, never the 1GB light machine that hosts Beat. Set before enabling
  # KRIA_INTENT_REVIEW_ENABLED.
  KRIA_INTENT_REVIEW_EVIDENCE_QUEUE = "autoplace-jobs"
  # Deploy the dedicated worker before switching POOL_ASSET_ANALYSIS_QUEUE via
  # a Fly secret. Initial routing deliberately remains the code default: celery.
  # Same for VISUALS_ANALYSIS_QUEUE: deploy the worker that consumes
  # visuals-analysis first, then set the secret (unset it to roll back).

[build]
  dockerfile = "Dockerfile"

[deploy]
  # The persona-owner remediation completed before this release. Keep every
  # application process gated behind the complete linear schema, including the
  # upload-reservation fields in 0074.
  release_command = "python -m alembic upgrade head"

# ---------------------------------------------------------------------------
# Process groups
# ---------------------------------------------------------------------------

[processes]
  api = "uvicorn app.main:app --host 0.0.0.0 --port 8000"
  # concurrency=1: shared-CPU workers shouldn't multiplex video encode tasks.
  # With concurrency=2 each task fights another for the 2 shared CPUs, so a
  # 14s local curtain-close encode ballooned to >600s in prod (job d018d1c3
  # post-PR #103). One task per worker means each task gets the full CPU
  # allocation. Trade-off: half the parallel throughput, but each render
  # completes in roughly a quarter of the wall-clock.
  # -Q celery,plan-jobs,overlay-jobs,creator-guided-jobs,creator-render-v2,
  # creator-fidelity-v1,autoplace-jobs,speech-analysis,visuals-analysis: also
  # drain the content-plan render and overlay queues. Per-item plan renders
  # (generate_plan_item_videos → orchestrate_generative_job) are routed to `plan-jobs` so generate-first-week
  # can enqueue 7 at once; the single concurrency=1 slot serializes them, so
  # they can never run simultaneously and OOM the worker (sized in [[vm]]
  # below; plan T3). creator-guided-jobs fences expanded mixed-media cuts and
  # creator-render-v2 fences chat Creator jobs from rolling legacy workers.
  # During the device-only admission release, the worker also subscribes to
  # the analysis queues (visuals-analysis included) while their dedicated
  # groups remain defined for a safe drain/canary window. One worker slot still
  # means one task at a time.
  # This -Q list is CI-pinned against app/services/queue_state.py's
  # RENDER_WORKER_QUEUES by tests/test_worker_prewarm_gate.py.
  worker = "celery -A app.worker worker --loglevel=info --concurrency=1 -Q celery,plan-jobs,overlay-jobs,creator-guided-jobs,creator-render-v2,creator-fidelity-v1,autoplace-jobs,speech-analysis,visuals-analysis"
  # 2026-08-02 (render-worker autostop): moves ALL Beat-triggered tasks
  # (sweep_stale_jobs, cleanup_agent_runs, send_daily_digest,
  # cleanup_cancelled_job, and every app.tasks.tiktok.* periodic — see
  # `task_routes` in app/worker.py) off the `worker` process onto this
  # small, always-on machine. Without this split, the `worker` machine can
  # never sit idle for more than a few minutes (the 5-min sweeper alone
  # guarantees it), which defeats the whole point of scaling it to zero
  # when RENDER_AUTOSTOP_ENABLED is on. concurrency=2: these are quick,
  # light, non-FFmpeg tasks — no encode-contention concern like the worker
  # process has.
  # -B: Celery Beat runs embedded in this process (2026-08-22, cost cut —
  # replaces the separate `beat` process group + its 256MB machine). Beat
  # drives the every-5-min stale-job sweeper and the render-worker lifecycle
  # backstop. Beat does NOT de-duplicate across replicas, so `light` MUST
  # stay at exactly one machine (`fly scale count light=1`).
  light = "celery -A app.worker worker --loglevel=info --concurrency=2 -Q maintenance,agent-control -B"

# ---------------------------------------------------------------------------
# HTTP service (api process only)
# ---------------------------------------------------------------------------

[[services]]
  protocol = "tcp"
  internal_port = 8000
  processes = ["api"]
  # auto_stop_machines + min_machines_running prevents the proxy's
  # autostopper from racing rolling deploys. With a single api replica and
  # no floor, the proxy autostops the machine ~10s after flyctl takes its
  # lease — leaving a "stopped with new image" machine that nothing
  # restarts until the orchestrator's 5m poll times out and red-marks an
  # otherwise-successful deploy. Canonical trace:
  # https://github.com/emirerben/nova/actions/runs/26036712549 (PR #217).
  #
  # KRI-193 (2026-09-24): prod was scaled to `fly scale count api=2` (for
  # redundancy) without this floor being raised to match. With the floor
  # stuck at 1, autostop was free to idle the second machine down to 0
  # during low traffic, so a rolling deploy of the sole remaining machine
  # had no healthy peer to serve traffic while it restarted — an ~18s
  # outage window (`instance refused connection` / `machine was recently
  # stopped`, e.g. releases v1267/v1268). Floor must track the actual `fly
  # scale count api=N` — currently 2 — not assume single-replica prod.
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 2

  [[services.ports]]
    port = 80
    handlers = ["http"]
    force_https = true

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

  [[services.http_checks]]
    interval = 15000        # ms
    grace_period = "10s"
    method = "GET"
    path = "/health"
    protocol = "http"
    timeout = 5000          # ms

# ---------------------------------------------------------------------------
# Worker — always running, no HTTP exposure
# ---------------------------------------------------------------------------

[[services]]
  processes = ["worker"]
  auto_stop_machines = false
  auto_start_machines = true

# ---------------------------------------------------------------------------
# Light — always running, no HTTP exposure. Carries the Beat-triggered
# maintenance tasks so the worker machine above can sit stopped when
# RENDER_AUTOSTOP_ENABLED is on. This machine must NEVER be allowed to sit
# idle-stopped itself — it's what wakes the worker back up, both via the
# app-level wake hook (which fires from wherever a task is dispatched, not
# necessarily this machine) and the periodic lifecycle backstop task that
# runs HERE. See agents/DECISIONS.md for the render-worker autostop design
# and its Beat-liveness failure mode.
# ---------------------------------------------------------------------------

[[services]]
  processes = ["light"]
  auto_stop_machines = false
  auto_start_machines = true

# ---------------------------------------------------------------------------
# VM sizing per process group
# ---------------------------------------------------------------------------

[[vm]]
  processes = ["api"]
  cpu_kind = "shared"
  cpus = 1
  # 2026-05-18: 512 → 2048. Kernel OOM-killed uvicorn during a 4-concurrent
  # clip_prefetch burst (template 7b4a98d5…, batch-9774726a9e3d). Log:
  #   "Out of memory: Killed process 636 (uvicorn) total-vm:900984kB"
  # The Semaphore(4) in app/services/clip_prefetch.py was sized against
  # the 512MB budget but didn't account for /tmp being tmpfs on Firecracker
  # — each in-flight clip's tempfile.TemporaryDirectory() counts against
  # RAM. 2048MB covers the observed ~900MB peak with ~1.1GB headroom so
  # larger clip batches (longer/higher-bitrate footage, future workloads)
  # don't push us back into OOM territory. If we ever see OOMs at 2048
  # the structural fix is moving clip_prefetch off the api process onto
  # the worker pool (which has 6144MB).
  memory_mb = 2048

# Light — small always-on VM for embedded Beat (-B) + the Beat-triggered
# maintenance tasks (see task_routes in app/worker.py). Deliberately does NOT host any
# task that downloads media or loads torch (match_pool_clips,
# style_vision_build.*, drive_import.*, agentic_template_build_task,
# analyze_music_track_task all stay on the render worker) — those would
# OOM this VM.
# 2026-08-04: 512 → 1024. At 512MB the machine ran with ~7MB available
# from its first minute (Fly Prometheus, 2026-08-02): celery parent + 2
# prefork children of the full app import already filled the VM, and the
# worker_ready CLIP prewarm (now queue-gated in app/worker.py — that gate
# is the actual fix) OOM crash-looped it until flyd's on-failure restart
# budget ran out and the machine parked `stopped` through every subsequent
# deploy, silently killing the sweeper/digest/TikTok lanes for two days.
# 1024 gives the baseline real headroom; concurrency=2 means two
# maintenance tasks (e.g. cleanup_agent_runs batched DELETEs) can run at
# once. See agents/DECISIONS.md (2026-08-04).
[[vm]]
  processes = ["light"]
  cpu_kind = "shared"
  cpus = 1
  memory_mb = 1024

[[vm]]
  processes = ["worker"]
  # 2026-11-02 (KRI-device-only topology, runbook Release 2): performance-4x/
  # 8192MB -> shared-cpu-4x/4096MB. The dedicated cores were justified in
  # August by cloud Skia/FFmpeg renders (a 600s Skia PNG-sequence burn timed
  # out on shared cores — see agents/DECISIONS.md "Worker VM re-reverted").
  # Both justifications are gone: CLOUD_RENDER_EXECUTION_ENABLED=false and
  # IOS_DEVICE_ONLY_MODE=true mean renders happen on the phone, and
  # GENERATIVE_PARALLEL_VARIANTS_ENABLED was never turned on. The worker now
  # compiles phone recipes and runs analysis (autoplace-jobs, speech-analysis,
  # visuals-analysis) — it absorbed the former autoplace/speech_analysis
  # groups. Rollback if renders/analysis OOM or time out:
  # `fly scale memory 8192 --process-group worker`, then performance-4x.
  cpu_kind = "shared"
  cpus = 4
  memory_mb = 4096
