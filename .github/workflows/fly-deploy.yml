name: Fly Deploy

# Deploys the API + worker process groups to Fly.io on every push to main.
# Frontend deploys are handled separately by Vercel's GitHub integration.
#
# Setup: requires `FLY_API_TOKEN` repo secret. Generate with:
#   flyctl auth token
# Then add via Settings → Secrets and variables → Actions → New repository secret.
#
# The release_command in fly.toml runs migrations automatically, so they ship as
# part of the deploy and need no separate step here. fly.toml is the source of
# truth for WHICH revision it targets — normally `upgrade head`, but a staged
# migration with a data precondition can pin it to an intermediate revision.
# While it is pinned, TODOS.md carries a P0 to restore it: a green deploy alone
# is not evidence that the newest migration actually applied.
#
# The Deploy step below wraps flyctl in scripts/fly-deploy-with-retry.sh,
# which retries exactly once on the signature-gated release-machine startup
# kill (SIGTERM, exit 143) tracked in issue #834 — any other failure still
# fails the run immediately, visibly.
on:
  push:
    branches:
      - main
    # Skip deploy when the push only touches files that don't reach Fly:
    # web app, docs, or workflow tweaks unrelated to the runtime image.
    paths-ignore:
      - "src/apps/web/**"
      - "docs/**"
      - "**/*.md"
      - ".gitignore"
      - ".vercelignore"
  workflow_dispatch:
    inputs:
      expected_sha:
        description: "Optional immutable main revision expected by this dispatch"
        required: false
        default: ""
        type: string
      creator_duration_check_mode:
        description: "Creator duration-contract behavior for this release"
        required: false
        default: "log_only"
        type: choice
        options:
          - log_only
          - enforce
      length_promotion_evidence:
        description: "KRI-499 promotion evidence JSON; required when enforcing"
        required: false
        default: ""
        type: string
      acknowledge_failed_backfill_machine_id:
        description: "Optional exact stopped failed backfill Machine ID to release before a fix deploy"
        required: false
        default: ""
        type: string

# Keep the historical GitHub lock name for queue compatibility. The workflow
# also acquires one stable, unmanaged Fly Machine name before deploy; Machine
# name uniqueness is the server-side CAS when a runner is cancelled or delayed.
concurrency:
  group: fly-deploy-main
  cancel-in-progress: false

jobs:
  deploy:
    # ``workflow_dispatch`` lets an operator select any ref. Production must
    # never deploy an unmerged feature branch, even when every digest/revision
    # check below would otherwise be internally consistent for that branch.
    if: github.ref == 'refs/heads/main'
    name: Deploy to Fly.io
    runs-on: ubuntu-latest
    # Acquisition may finish a cancelled 5h backfill before atomically taking
    # the same stable Machine name. The deploy command itself remains bounded
    # to 35m, inside the dormant deploy guard's server-side lease.
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0

      - name: Verify immutable manual dispatch revision
        if: github.event_name == 'workflow_dispatch' && inputs.expected_sha != ''
        env:
          EXPECTED_SHA_INPUT: ${{ inputs.expected_sha }}
          CHECKED_OUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          [[ "$EXPECTED_SHA_INPUT" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::expected_sha must be a 40-character lowercase SHA"
            exit 1
          }
          [[ "$EXPECTED_SHA_INPUT" == "$CHECKED_OUT_SHA" ]] || {
            echo "::error::expected_sha does not match the checked-out main revision"
            exit 1
          }

      - name: Validate creator duration rollout mode
        if: github.event_name == 'workflow_dispatch'
        env:
          CREATOR_DURATION_CHECK_MODE: ${{ inputs.creator_duration_check_mode }}
        run: |
          set -euo pipefail
          [[ "$CREATOR_DURATION_CHECK_MODE" == "log_only" || "$CREATOR_DURATION_CHECK_MODE" == "enforce" ]] || {
            echo "::error::creator_duration_check_mode must be log_only or enforce"
            exit 1
          }

      - name: Set up Python for KRI-499 promotion validation
        if: github.event_name == 'workflow_dispatch' && inputs.creator_duration_check_mode == 'enforce'
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"

      - name: Install KRI-499 promotion validator dependencies
        if: github.event_name == 'workflow_dispatch' && inputs.creator_duration_check_mode == 'enforce'
        working-directory: src/apps/api
        run: python -m pip install .

      - name: Validate KRI-499 enforcement promotion evidence
        if: github.event_name == 'workflow_dispatch' && inputs.creator_duration_check_mode == 'enforce'
        env:
          LENGTH_PROMOTION_EVIDENCE: ${{ inputs.length_promotion_evidence }}
          EXPECTED_SHA: ${{ github.sha }}
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys

          from app.services.contract_check_rollout import validate_promotion

          raw = os.environ.get("LENGTH_PROMOTION_EVIDENCE", "")
          if not raw:
              raise SystemExit("::error::length_promotion_evidence is required for enforce")
          try:
              evidence = json.loads(raw)
          except json.JSONDecodeError as exc:
              raise SystemExit(f"::error::length_promotion_evidence is not valid JSON: {exc}")
          if not isinstance(evidence, dict):
              raise SystemExit("::error::length_promotion_evidence must be a JSON object")
          report = validate_promotion(evidence).to_dict()
          print(json.dumps(report, sort_keys=True))
          if report["candidate_sha"] != os.environ["EXPECTED_SHA"]:
              raise SystemExit("::error::promotion evidence candidate_sha does not match github.sha")
          if report["status"] != "passed":
              raise SystemExit("::error::promotion evidence remains pending")
          PY

      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1
        with:
          version: 0.4.94

      - name: Acquire durable Fly mutation guard
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          ACKNOWLEDGE_FAILED_BACKFILL_MACHINE_ID: ${{ inputs.acknowledge_failed_backfill_machine_id }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
        run: bash scripts/run-video-poster-backfill.sh --acquire-deploy-guard

      - name: Resolve creator duration mode from guarded fleet
        id: creator-duration-mode
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          REQUESTED_MODE: ${{ github.event_name == 'workflow_dispatch' && inputs.creator_duration_check_mode || '' }}
        run: |
          set -euo pipefail
          machines_json="$(flyctl machine list --app nova-video --json | jq -c '[.[] | select((((.config.metadata // .incomplete_config.metadata // {}).fly_process_group) == "fly_app_release_command" and (.state == "stopped" or .state == "destroyed")) | not)]')"
          resolver_args=(--machines-json "$machines_json")
          if [[ -n "$REQUESTED_MODE" ]]; then
            resolver_args+=(--requested-mode "$REQUESTED_MODE")
          fi
          resolved_mode="$(python scripts/ci/resolve-creator-duration-mode.py "${resolver_args[@]}")"
          [[ "$resolved_mode" == "log_only" || "$resolved_mode" == "enforce" ]] || {
            echo "::error::creator duration mode resolver returned an invalid mode"
            exit 1
          }
          echo "mode=$resolved_mode" >> "$GITHUB_OUTPUT"

      - name: Deploy
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
          CREATOR_DURATION_CHECK_MODE: ${{ steps.creator-duration-mode.outputs.mode }}
        run: |
          chmod +x scripts/fly-deploy-with-retry.sh
          timeout --signal=TERM --kill-after=60s 2100s \
            scripts/fly-deploy-with-retry.sh \
            --remote-only \
            --env "CREATOR_DURATION_CHECK_MODE=${CREATOR_DURATION_CHECK_MODE}" \
            --env "CREATOR_DURATION_CHECK_REVISION=${GITHUB_SHA}" \
            --label "org.opencontainers.image.revision=${GITHUB_SHA}"

      - name: Verify exact deployed image, unmanaged guard, and health
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          guard_name='nova-video-production-mutation-guard'
          guard_owner="${GITHUB_RUN_ID}:${GITHUB_RUN_ATTEMPT}"
          managed_fleet_has_required_processes() {
            jq -e '
              [.[]
                | select(
                    ((.config.metadata // .incomplete_config.metadata // {})
                      | has("fly_process_group"))
                  )] as $managed
              | any($managed[];
                  ((.config.metadata // .incomplete_config.metadata).fly_process_group) == "api")
                and any($managed[];
                  ((.config.metadata // .incomplete_config.metadata).fly_process_group) == "worker")
                and any($managed[];
                  ((.config.metadata // .incomplete_config.metadata).fly_process_group) == "light")
                and any($managed[];
                  ((.config.metadata // .incomplete_config.metadata).fly_process_group) == "autoplace")
            ' >/dev/null
          }
          managed_fleet_has_transitional_states() {
            jq -e '
              [.[]
                | select(
                    ((.config.metadata // .incomplete_config.metadata // {})
                      | has("fly_process_group"))
                  )]
              | any(.state == "starting" or .state == "stopping")
            ' >/dev/null
          }
          managed_fleet_is_operationally_stable() {
            jq -e '
              [.[]
                | select(
                    ((.config.metadata // .incomplete_config.metadata // {})
                      | has("fly_process_group"))
                  )] as $managed
              | any($managed[];
                  ((.config.metadata // .incomplete_config.metadata).fly_process_group) == "api"
                    and .state == "started")
                and any($managed[];
                  ((.config.metadata // .incomplete_config.metadata).fly_process_group) == "worker")
                and any($managed[];
                  ((.config.metadata // .incomplete_config.metadata).fly_process_group) == "light"
                    and .state == "started")
                and any($managed[];
                  ((.config.metadata // .incomplete_config.metadata).fly_process_group) == "autoplace"
                    and .state == "started")
                and all($managed[];
                  (.config // .incomplete_config // {}) as $config
                  | (($config.metadata // {}).fly_process_group) as $group
                  | ([.events[]? | select(.type == "start" or .type == "exit")]) as $lifecycle_events
                  | ([$lifecycle_events[] | select(.type == "exit")]
                      | sort_by(.timestamp) | last | .request.exit_event) as $last_exit
                  | ($group | type == "string" and length > 0)
                    and (
                      .state == "started"
                      or (
                        .state == "stopped"
                        and (
                          ($group == "api"
                            and any(($config.services // [])[]?;
                              .autostop == true or .autostop == "stop"))
                          or ($group == "worker"
                            and (
                              ($lifecycle_events | length == 0)
                              or ($last_exit.requested_stop == true
                                and ($last_exit.oom_killed // false) == false
                                and ($last_exit.restarting // false) == false)
                            ))
                        )
                      )
                    )
                )
            ' >/dev/null
          }
          for attempt in $(seq 1 20); do
            machines_json="$(flyctl machine list --app nova-video --json | jq -c '[.[] | select((((.config.metadata // .incomplete_config.metadata // {}).fly_process_group) == "fly_app_release_command" and (.state == "stopped" or .state == "destroyed")) | not)]')"
            managed_count="$(jq '[.[] | select(((.config.metadata // .incomplete_config.metadata // {}) | has("fly_process_group")))] | length' <<<"$machines_json")"
            digest_count="$(jq '[.[] | select(((.config.metadata // .incomplete_config.metadata // {}) | has("fly_process_group"))) | .image_ref.digest] | unique | length' <<<"$machines_json")"
            [[ "$managed_count" -ge 1 && "$digest_count" == "1" ]] || {
              echo "::error::managed production Machines do not expose one immutable digest"
              exit 1
            }
            managed_fleet_has_required_processes <<<"$machines_json" || {
              echo "::error::managed production Machines are missing a required api, worker, light, or autoplace process group"
              exit 1
            }
            jq -e '
              [.[]
                | select(
                    ((.config.metadata // .incomplete_config.metadata // {})
                      | has("fly_process_group"))
                  )]
              | all(
                  .state == "started" or .state == "stopped"
                  or .state == "starting" or .state == "stopping"
                )
            ' <<<"$machines_json" >/dev/null || {
              echo "::error::managed production Machines expose an unsafe lifecycle state"
              exit 1
            }
            if managed_fleet_is_operationally_stable <<<"$machines_json"; then
              break
            fi
            managed_fleet_has_transitional_states <<<"$machines_json" || {
              echo "::error::managed production Machines do not satisfy the required stable process topology"
              exit 1
            }
            [[ "$attempt" -lt 20 ]] || {
              echo "::error::managed production Machines did not reach the required stable process topology"
              exit 1
            }
            echo "Waiting for managed production Machines to settle ($attempt/20)..."
            sleep 20
          done
          jq -e \
            --arg name "$guard_name" \
            --arg owner "$guard_owner" \
            --arg sha "$EXPECTED_SHA" '
              [.[] | select(.name == $name)]
              | length == 1
                and ((.[0].state == "created") or (
                  .[0].state == "stopped"
                  and ([.[0].events[]?
                    | select(.type == "start" or .type == "exit")]
                    | length == 0)
                ))
                and .[0].image_ref.digest
                  == ((.[0].config.metadata // .[0].incomplete_config.metadata)
                    .nova_image_digest)
                and ((.[0].config.metadata // .[0].incomplete_config.metadata).nova_operation
                  == "fly-deploy-guard")
                and ((.[0].config.metadata // .[0].incomplete_config.metadata).nova_guard_owner
                  == $owner)
                and ((.[0].config.metadata // .[0].incomplete_config.metadata).nova_revision
                  == $sha)
                and (((.[0].config.metadata // .[0].incomplete_config.metadata)
                  | has("fly_process_group")) | not)
                and ((.[0].config // .[0].incomplete_config).restart.policy == "no")
                and ((.[0].config // .[0].incomplete_config).init.cmd == ["/bin/false"])
            ' <<<"$machines_json" >/dev/null || {
              echo "::error::deploy guard is not exact, dormant, and unexecuted"
              exit 1
            }
          deployed_digest="$(
            jq -er '
              [.[]
                | select(
                    ((.config.metadata // .incomplete_config.metadata // {})
                      | has("fly_process_group"))
                  )
                | .image_ref.digest]
              | unique
              | if length == 1 then .[0] else empty end
              | select(test("^sha256:[0-9a-f]{64}$"))
            ' <<<"$machines_json"
          )"
          jq -e --arg digest "$deployed_digest" '
            [.[]
              | select(
                  ((.config.metadata // .incomplete_config.metadata // {})
                    | has("fly_process_group"))
                )]
            | length >= 1 and all(.image_ref.digest == $digest)
          ' <<<"$machines_json" >/dev/null || {
            echo "::error::managed production Machines do not all match the verified digest"
            exit 1
          }

          image_json="$(flyctl image show --app nova-video --json)"
          deployed_sha="$(
            jq -er \
              --arg digest "$deployed_digest" \
              --arg label 'org.opencontainers.image.revision' '
              [.[]
                | select(.Digest == $digest)
                | .Labels
                | if type == "string" then fromjson else . end
                | .[$label]]
              | unique
              | if length == 1 then .[0] else empty end
              | select(type == "string" and test("^[0-9a-f]{40}$"))
            ' <<<"$image_json"
          )"
          [[ "$deployed_sha" == "$EXPECTED_SHA" ]]
          flyctl status --app nova-video
          curl --fail --silent --show-error --retry 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            https://nova-video.fly.dev/health >/dev/null
          printf '%s %s\n' "$EXPECTED_SHA" "$deployed_digest" \
            >"$RUNNER_TEMP/nova-fly-deploy-verified"

      - name: Release durable Fly mutation guard
        if: always()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          receipt="$RUNNER_TEMP/nova-fly-deploy-verified"
          if [[ ! -f "$receipt" ]]; then
            echo "::warning::Exact digest/revision/health verification did not finish; retaining the deploy guard until its validated reclaim deadline."
            exit 0
          fi
          read -r verified_sha verified_digest <"$receipt"
          [[ "$verified_sha" == "$EXPECTED_SHA" \
            && "$verified_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          VERIFIED_DEPLOY_DIGEST="$verified_digest" \
            bash scripts/run-video-poster-backfill.sh --release-deploy-guard
