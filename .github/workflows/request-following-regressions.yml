name: Request-following regressions

on:
  schedule:
    - cron: '17 5 * * *'
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/request-following-regressions.yml'
      - 'scripts/request-following-regressions.py'
      - 'scripts/request-following-live-report.py'
      - 'scripts/request-following-loop.py'
      - 'scripts/request-following-review.py'
      - 'tools/request-following-review/**'
      - 'src/apps/api/app/models.py'
      - 'src/apps/api/app/config.py'
      - 'src/apps/api/app/worker.py'
      - 'src/apps/api/app/migrations/versions/**'
      - 'src/apps/api/tests/incidents/**'
      - 'src/apps/api/tests/evals/request_following/**'
      - 'src/apps/api/app/services/request_following_*.py'
      - 'src/apps/api/app/routes/admin_request_following.py'
      - 'src/apps/api/app/tasks/request_following.py'
      - 'src/apps/api/tests/integration/test_request_following_queue.py'

permissions:
  contents: read

concurrency:
  group: request-following-regressions-${{ github.ref }}
  cancel-in-progress: false

jobs:
  offline:
    name: Free request-following regression report
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nova_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 10s
          --health-timeout 5s --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
      REDIS_URL: redis://localhost:6379
      STORAGE_BUCKET: nova-test
      STORAGE_PROVIDER: gcs
      GEMINI_API_KEY: test
      OPENAI_API_KEY: test
      TOKEN_ENCRYPTION_KEY: test-key-not-used-in-unit-tests
      ALLOWED_ORIGINS: '["http://localhost:3000"]'
      NOVA_EVAL_MODE: replay
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        working-directory: src/apps/api
        run: pip install -e '.[dev]'
      - name: Install renderer libraries
        run: |
          sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
          sudo bash scripts/ci/apt-install.sh ffmpeg libegl1 libgl1
      - name: Migrate disposable database
        working-directory: src/apps/api
        run: python -m alembic upgrade head
      - name: Run existing offline regressions and reports
        run: python scripts/request-following-regressions.py --output .request-following-report
      - name: Fetch reviewed recent exports
        if: always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          REQUEST_FOLLOWING_REPORT_TOKEN: ${{ secrets.REQUEST_FOLLOWING_REPORT_TOKEN }}
        run: python scripts/request-following-live-report.py --output .request-following-report
      - name: Publish summary
        if: always()
        run: |
          if [ -f .request-following-report/reviewed-sessions.md ]; then
            cat .request-following-report/reviewed-sessions.md >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .request-following-report/summary.md ]; then
            cat .request-following-report/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'Regression runner did not produce a report. Inspect the failed setup/run step.' >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: request-following-${{ github.run_id }}-${{ github.run_attempt }}
          path: .request-following-report/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 14
