name: Select CI suites

on:
  workflow_call:
    outputs:
      api:
        value: ${{ jobs.select.outputs.api }}
      shared_motion:
        value: ${{ jobs.select.outputs.shared_motion }}
      ios:
        value: ${{ jobs.select.outputs.ios }}
      ios_ui_groups:
        value: ${{ jobs.select.outputs.ios_ui_groups }}
      ios_ui:
        value: ${{ jobs.select.outputs.ios_ui }}
      ios_ui_shards:
        value: ${{ jobs.select.outputs.ios_ui_shards }}
      journey:
        value: ${{ jobs.select.outputs.journey }}
      journey_coverage:
        value: ${{ jobs.select.outputs.journey_coverage }}
      journey_ids:
        value: ${{ jobs.select.outputs.journey_ids }}
      native_validation:
        value: ${{ jobs.select.outputs.native_validation }}
      journey_needs_native:
        value: ${{ jobs.select.outputs.journey_needs_native }}
      native_legs:
        description: JSON list of iPhone validation matrix legs to start.
        value: ${{ jobs.select.outputs.native_legs }}
      ios_render_evidence:
        description: Whether PR unit runs include the slow export/OCR proofs (scripts/ios/render_evidence.py).
        value: ${{ jobs.select.outputs.ios_render_evidence }}

jobs:
  select:
    runs-on: ubuntu-latest
    # Full-history checkout dominates; slowest green run 3.8 min (typical ~0.3).
    timeout-minutes: 10
    outputs:
      api: ${{ steps.select.outputs.api }}
      shared_motion: ${{ steps.select.outputs.shared_motion }}
      ios: ${{ steps.select.outputs.ios }}
      ios_ui: ${{ steps.select.outputs.ios_ui }}
      ios_ui_groups: ${{ steps.select.outputs.ios_ui_groups }}
      ios_ui_shards: ${{ steps.select.outputs.ios_ui_shards }}
      journey: ${{ steps.select.outputs.journey }}
      journey_coverage: ${{ steps.select.outputs.journey_coverage }}
      journey_ids: ${{ steps.select.outputs.journey_ids }}
      native_validation: ${{ steps.select.outputs.native_validation }}
      journey_needs_native: ${{ steps.select.outputs.journey_needs_native }}
      native_legs: ${{ steps.select.outputs.native_legs }}
      ios_render_evidence: ${{ steps.select.outputs.ios_render_evidence }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test CI selection and required-check contracts
        run: python3 -m unittest discover -s scripts/ci -p 'test_*.py' -v
      - name: Select affected suites
        id: select
        env:
          CI_EVENT: ${{ github.event_name }}
          CI_BASE: ${{ github.event.pull_request.base.sha }}
          CI_HEAD: ${{ github.event.pull_request.head.sha }}
        run: python3 scripts/ci/select-tests.py
