name: exp-keyboard-idle
on:
  push:
    branches: [codex/exp-keyboard-idle]
permissions:
  contents: read
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 210
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: a
            passes: 12
            allow: 600
            tests: SlidePostUITests/testExpSwapLoopGlass SlidePostUITests/testExpSwapLoopBalanced
          - label: b
            passes: 12
            allow: 600
            tests: SlidePostUITests/testExpSwapLoopGlass SlidePostUITests/testExpSwapLoopBalanced
          - label: c
            passes: 60
            allow: 180
            tests: CreationUITests/testChangedEditorPreviewRetainsOldPictureAndBlocksExportThenSupportsManualUndo
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Project and simulator
        run: |
          set -euo pipefail
          bash scripts/ios/generate-project.sh
          SIM=$(xcrun simctl list devices available -j | /usr/bin/python3 scripts/exp-select-sim.py)
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b || true
      - name: a and b switch Style and Edit text 40 times per launch, as shipped then with each double start balanced by one extra stop; c is the editor test that hangs alone (${{ matrix.label }})
        env:
          ALLOW: ${{ matrix.allow }}
          ALLOW_MAX: ${{ matrix.allow == 600 && 600 || 300 }}
        run: bash scripts/exp-kbd.sh "${{ matrix.label }}" "${{ matrix.passes }}" 0 ${{ matrix.tests }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kbd-logs-${{ matrix.label }}
          path: |
            src/apps/ios/*.log
            src/apps/ios/sample-*.txt
            src/apps/ios/stalls-*.txt
          retention-days: 3
