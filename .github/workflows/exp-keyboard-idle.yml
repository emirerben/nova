name: exp-keyboard-idle
on:
  push:
    branches: [codex/exp-keyboard-idle]
permissions:
  contents: read
env:
  TESTS: >-
    SlidePostUITests/testExpSwapLoopGlass SlidePostUITests/testExpSwapLoopOpaque
jobs:
  capture:
    runs-on: macos-15
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: a
            busy: 0
          - label: b
            busy: 0
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Project and simulator
        run: |
          set -euo pipefail
          bash scripts/ios/generate-project.sh
          SIM=$(xcrun simctl list devices available -j | /usr/bin/python3 scripts/exp-select-sim.py)
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
          xcrun simctl bootstatus "$SIM" -b || true
      - name: Style and Edit text switched 40 times per launch, glass then opaque, 8 passes (${{ matrix.label }})
        env:
          ALLOW: 600
          ALLOW_MAX: 600
        run: bash scripts/exp-kbd.sh "${{ matrix.label }}" 8 "${{ matrix.busy }}" $TESTS
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kbd-logs-${{ matrix.label }}
          path: |
            src/apps/ios/*.log
            src/apps/ios/sample-*.txt
            src/apps/ios/stalls-*.txt
          retention-days: 3
