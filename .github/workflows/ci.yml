name: CI

# `push: main` is not redundant with `pull_request`. A PR is tested as a MERGE
# of its branch with main, so a suite can be green on every open PR while main
# itself is broken — and the breakage then surfaces on whichever unrelated PR
# opens next, attributed to the wrong author.
#
# That is not hypothetical here. On 2026-08-13 a stale-read bug on main made
# tests/routes/test_plan_item_sync_dispatch.py fail deterministically. test-api
# is a REQUIRED check, so it blocked every PR in the repo, and it was first seen
# on a frontend-only PR that touched zero Python — costing an hour to prove the
# failure was not that PR's. Running on push attributes it to the commit that
# caused it, immediately.
#
# Cost: roughly double the CI minutes (test-api alone is ~8 min).
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/apps/web/package.json') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install web dependencies
        working-directory: src/apps/web
        run: pnpm install --no-frozen-lockfile
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Run lint
        run: make lint

  test-web-suites:
    name: web (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [interaction-1, interaction-2, interaction-3, interaction-4, remaining]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: denoland/setup-deno@v2
        if: matrix.group == 'remaining'
        with:
          deno-version: v2.7.13
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/apps/web/package.json') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install web dependencies
        working-directory: src/apps/web
        run: pnpm install --no-frozen-lockfile
      - name: Cache offline CanvasKit motion dependencies
        if: matrix.group == 'remaining'
        working-directory: src/apps/web
        run: |
          deno cache --no-config --node-modules-dir=none \
            npm:@webgpu/types@0.1.21 \
            npm:canvaskit-wasm@0.40.0
          deno cache --no-config --node-modules-dir=none \
            ../../packages/motion-runtime/server/render-sequence.ts \
            ../../packages/motion-runtime/server/render-frame.ts
      - name: Verify CI runner contracts
        run: node --test scripts/ci/web-tests.test.mjs
      - name: Run web tests with timing reports
        run: node scripts/ci/web-tests.mjs "${{ matrix.group }}"
      - name: Upload web test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-tests-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/web/
          if-no-files-found: warn
      - name: Record job outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Web group ${{ matrix.group }} job outcome (including setup) $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"

  # Keep a stable check name for consumers. An absent/skipped/cancelled matrix
  # must not turn into a green check through Actions' default needs skipping.
  test-web:
    if: always()
    needs: [test-web-suites]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Require every web test group to pass
        env:
          WEB_TEST_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci/web-tests.mjs gate

  test-api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nova_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Disable unused Chrome apt source
        run: sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
      - name: Install FFmpeg and Skia runtime libs
        # libegl1 + libgl1 are needed by skia-python (used by
        # app/pipeline/text_overlay_skia.py). On macOS these ship with the OS;
        # the Ubuntu runner needs them installed explicitly or the module
        # import fails with `libEGL.so.1: cannot open shared object file`.
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libegl1 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Verify Alembic upgrade-downgrade roundtrip
        working-directory: src/apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
          REDIS_URL: redis://localhost:6379
          STORAGE_BUCKET: nova-test
          STORAGE_PROVIDER: gcs
          OPENAI_API_KEY: sk-test
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_TEST }}
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: |
          python -m alembic upgrade 0072
          python scripts/verify_content_plan_owner_constraint.py seed-mismatch
          if python -m alembic upgrade 0073; then
            echo "0073 unexpectedly accepted a cross-owner plan/persona row"
            exit 1
          fi
          python scripts/verify_content_plan_owner_constraint.py repair-mismatch
          python -m alembic upgrade 0073
          python scripts/verify_content_plan_owner_constraint.py verify-installed
          python -m alembic downgrade -1
          python -m alembic upgrade head
          python scripts/verify_0103_downgrade_state.py seed
          python -m alembic downgrade -1
          python scripts/verify_0103_downgrade_state.py verify
          python -m alembic upgrade head
      - name: Run API tests
        working-directory: src/apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
          REDIS_URL: redis://localhost:6379
          STORAGE_BUCKET: nova-test
          STORAGE_PROVIDER: gcs
          OPENAI_API_KEY: sk-test
          WHISPER_BACKEND: local
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_TEST }}
          WAITLIST_ADMIN_SECRET: test-admin-secret
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: pytest tests/ -v --ignore=tests/quality -n auto --timeout=60
