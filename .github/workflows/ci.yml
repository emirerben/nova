          PY
      - name: Verify gameday heading hierarchy and admitted timeline sources
        if: contains(needs.changes.outputs.journey_ids, 'kri-669-gameday')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          mkdir -p ../../../test-results/kri-559/kri-669
          python3 -m pytest tests/kria/test_gameday_text_hierarchy.py \
            tests/routes/test_native_timeline_sources.py \
            tests/routes/test_editor_sources.py \
            tests/routes/test_device_render.py -q \
            --junitxml=../../../test-results/kri-559/kri-669/api-tests.xml
      - name: Verify reviewed session-to-regression learning loop
        if: contains(needs.changes.outputs.journey_ids, 'kri-215-learning-loop')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
          GEMINI_API_KEY: test
        run: |
          mkdir -p ../../../test-results/kri-559/kri-215
          python3 -m pytest tests/incidents/test_request_following_loop.py tests/incidents/test_request_following_private_review.py -q \
            --junitxml=../../../test-results/kri-559/kri-215/api-tests.xml
      - name: Verify retake-aware speech cleanup and consent recovery
        if: contains(needs.changes.outputs.journey_ids, 'kri-551-consented-retakes')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/agents/test_retake_detector.py \
            tests/services/test_speech_cleanup_preflight.py tests/services/test_speech_cleanup_retakes_consent.py \
            tests/services/test_speech_cleanup_decision.py tests/tasks/test_speech_cleanup_analysis.py \
            tests/routes/test_creation_threads_speech_cleanup.py tests/kria/test_runtime_v2.py \
            tests/kria/test_runtime_speech_cleanup_approval.py \
            tests/kria/test_kri520_receipts.py tests/kria/test_brief_talking_receipts.py \
            tests/kria/test_brief_marathon_receipts.py tests/tasks/test_kri551_cleanup_review_note.py \
            tests/routes/test_creator_agent.py tests/tasks/test_marathon_render_ready_review.py \
            tests/kria/test_brief_rendered_speech_facts.py tests/kria/test_runtime_talking_first_draft.py -q \
            | tee ../../../test-results/kri-559/consented-retakes-api-tests.log
      # Without this, a diff selecting only kri-689 seals an empty bundle.
      - name: Verify clip-speed asks, review and phone speed safety
        if: contains(needs.changes.outputs.journey_ids, 'kri-689-clip-speed')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          tests="$(python3 -c 'import json; m = json.load(open("../../../scripts/ci/journey-manifest.json")); print(next(j for j in m["journeys"] if j["id"] == "kri-689-clip-speed")["api_tests"])')"
          python3 -m pytest $tests -q \
            | tee ../../../test-results/kri-559/clip-speed-api-tests.log
      # Without this, a diff selecting only kri-729 seals an empty bundle.
      - name: Verify camera-roll ideas, item states and export proof on the server
        if: contains(needs.changes.outputs.journey_ids, 'kri-729-camera-roll-recommendations')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          tests="$(python3 -c 'import json; m = json.load(open("../../../scripts/ci/journey-manifest.json")); print(next(j for j in m["journeys"] if j["id"] == "kri-729-camera-roll-recommendations")["api_tests"])')"
          python3 -m pytest $tests -q \
            | tee ../../../test-results/kri-559/camera-roll-api-tests.log
      - name: Seal portable fixture inputs for this exact workflow attempt
        if: needs.changes.outputs.journey_needs_native == 'true'
        env:
          JOURNEY_IDS: ${{ needs.changes.outputs.journey_ids }}
        run: python3 scripts/ci/journey-gate.py seal-bundle --root test-results/kri-559 --head "${{ github.sha }}" --run "${{ github.run_id }}" --attempt "${{ github.run_attempt }}" --journeys "$JOURNEY_IDS"
      - name: Transfer fixture inputs and offline evidence
        if: needs.changes.outputs.journey_needs_native == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fixture-bundle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/kri-559/
          retention-days: 14
          if-no-files-found: error
      - name: Upload portable diagnostics
        if: failure() || needs.changes.outputs.journey_needs_native != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kri-559-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/kri-559/
          retention-days: 14
          if-no-files-found: ignore

  journey-native:
    name: iPhone validation (${{ matrix.leg }})
    # Starts with the selector, not after journey-offline/journey-library: the
    # Macs compile while the Linux journeys run (~11 min, 2026-10-27..30) and
    # block only where the fixture bundle is consumed (wait-for-jobs.py). The
    # `journey` aggregate still requires both portable jobs to pass.
    needs: [changes, journey-mapping]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.native_validation == 'true' &&
      ((needs.changes.outputs.journey == 'true' && needs.journey-mapping.result == 'success') ||
       (needs.changes.outputs.journey == 'false' && needs.journey-mapping.result == 'skipped'))
    permissions:
      contents: read
      actions: read
    runs-on: macos-15
    # Up to three duration-balanced legs. `unit` compiles, runs unit tests, the
    # UI smoke subset and the named-unit gate; `creation` and `screens` compile
    # from the same cache and split the fixture-driven journeys. One serial Mac
    # took 40-55 min per PR (2026-10-23); each leg targets ~20 min. The selector
    # starts only the legs whose journeys were selected (LEG_JOURNEYS in
    # scripts/ci/select-tests.py); the `journey` aggregate requires every leg.
    strategy:
      fail-fast: false
      matrix:
        leg: ${{ fromJSON(needs.changes.outputs.native_legs || '["unit"]') }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native result directories
        run: mkdir -p test-results/kri-559 test-results/ios
      - name: Set up Xcode
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Start simulator boot early
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        run: |
          nohup env KRIA_IOS_TEST_MODE=boot bash scripts/ios/verify.sh \
            > test-results/ios/early-boot.log 2>&1 &
      - name: Install XcodeGen
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        run: brew install xcodegen
      - name: Identify Xcode cache
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        id: xcode-cache
        run: |
          echo "image=${ImageVersion:?Hosted runner image version is required for SDK caches}" >> "$GITHUB_OUTPUT"
          echo "toolchain=$({ xcode-select -p; xcodebuild -version; } | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Xcode build data
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            src/apps/ios/.derived-data/Build
            src/apps/ios/.derived-data/SourcePackages
            src/apps/ios/.derived-data/ModuleCache.noindex
            src/apps/ios/.derived-data/SDKStatCaches.noindex
            src/apps/ios/.derived-data/CompilationCache.noindex
          key: ios-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.image }}-${{ steps.xcode-cache.outputs.toolchain }}-${{ hashFiles('src/apps/ios/project.yml', 'src/apps/ios/**/Package.resolved', 'src/apps/ios/**/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ios-build-v2-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.image }}-${{ steps.xcode-cache.outputs.toolchain }}-${{ hashFiles('src/apps/ios/project.yml', 'src/apps/ios/**/Package.resolved', 'src/apps/ios/**/Package.swift') }}-
      - name: Build iPhone app and run selected unit tests
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        env:
          KRIA_IOS_TEST_MODE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true' && needs.changes.outputs.ios_ui == 'false' && needs.changes.outputs.journey_needs_native == 'false' && 'unit' || 'prepare-ui' }}
          # Only the unit leg executes the unit suite; the other legs compile
          # the same bundles and skip it (verify.sh prepare-ui contract).
          KRIA_IOS_UNIT_TESTS: ${{ matrix.leg == 'unit' && github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true' && '1' || '0' }}
          # The export/OCR proofs (~10 of the unit leg's minutes) run on PRs that
          # touch render, export or text code; ios.yml runs them on every main push.
          KRIA_IOS_SKIP_RENDER_EVIDENCE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ios_render_evidence == 'false' && '1' || '0' }}
          # Selected journeys keep the proofs they name (journey-gate.py native-units).
          KRIA_JOURNEY_IDS: ${{ needs.changes.outputs.journey_ids }}
          KRIA_RESTORE_INPUT_TIMES: '1'
        run: bash scripts/ios/verify.sh
      - name: Record compiled iPhone input timestamps
        if: matrix.leg == 'unit' && github.event_name == 'pull_request' && (needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true')
        run: python3 scripts/ios/cache-inputs.py save
      - name: Save Xcode build data for the next run
        if: matrix.leg == 'unit' && github.event_name == 'pull_request' && (needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true') && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            src/apps/ios/.derived-data/Build
            src/apps/ios/.derived-data/SourcePackages
            src/apps/ios/.derived-data/ModuleCache.noindex
            src/apps/ios/.derived-data/SDKStatCaches.noindex
            src/apps/ios/.derived-data/CompilationCache.noindex
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Wait for the portable journeys this leg depends on
        if: needs.changes.outputs.journey == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LIBRARY: ${{ contains(needs.changes.outputs.journey_ids, 'kri-384-library-ingest') && 'journey-library' || '' }}
        run: python3 scripts/ci/wait-for-jobs.py journey-offline "$LIBRARY"
      - name: Download this attempt's portable fixture inputs
        if: needs.changes.outputs.journey_needs_native == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fixture-bundle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/kri-559/
      - name: Check fixture provenance and transferred bytes
        if: needs.changes.outputs.journey_needs_native == 'true'
        env:
          JOURNEY_IDS: ${{ needs.changes.outputs.journey_ids }}
        run: |
          python3 scripts/ci/journey-gate.py verify-bundle --root test-results/kri-559 --head "${{ github.sha }}" --run "${{ github.run_id }}" --attempt "${{ github.run_attempt }}" --journeys "$JOURNEY_IDS"
          if [[ ",$JOURNEY_IDS," == *",kri-524-creation,"* ]]; then
            python3 scripts/ci/journey-gate.py verify-input --fixture test-results/kri-559/fixture --head "${{ github.sha }}"
          fi
      - name: Run selected iPhone UI scenarios
        if: github.event_name == 'pull_request' && needs.changes.outputs.ios_ui == 'true' && matrix.leg == 'unit'
        env:
          KRIA_IOS_TEST_MODE: ui
          KRIA_IOS_UI_GROUPS: ${{ needs.changes.outputs.ios_ui_groups == 'full' && 'smoke' || needs.changes.outputs.ios_ui_groups }}
        run: bash scripts/ios/verify.sh
      - name: Verify native speed reset, inspector Undo and pinch warning
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-689-clip-speed')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/ios/simulator-id.txt)" \
            -parallel-testing-enabled NO \
            -only-testing:KriaUITests/NativeSpeedUITests \
            -only-testing:KriaUITests/NativeEditorInspectorUITests/testSourcePreviewTextCreationAndAnimations \
            -resultBundlePath ../../../test-results/kri-559/native-editor-gestures.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/native-editor-gestures.xcresult \
            > ../../../test-results/kri-559/native-editor-gesture-tests.json
          python3 ../../../scripts/ci/journey-gate.py verify-tests \
            --test-results ../../../test-results/kri-559/native-editor-gesture-tests.json \
            --xctest NativeSpeedUITests/testDeviceClipSpeedAdjustsResetsAndUndoesThroughTheInspector \
            --xctest NativeSpeedUITests/testClosingSpeedInspectorCommitsResetForSingleUndo \
            --xctest NativeEditorInspectorUITests/testSourcePreviewTextCreationAndAnimations
      - name: Verify server suggestion chips stay visible and send the chosen action
        if: matrix.leg == 'screens' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-756-suggestion-chips')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/ios/simulator-id.txt)" \
            -only-testing:KriaUITests/CreationUITests/testServerSuggestionChipsSendOnTapAndReplaceFixedChips \
            -resultBundlePath ../../../test-results/kri-559/suggestion-chips-native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/suggestion-chips-native.xcresult \
            > ../../../test-results/kri-559/suggestion-chips-native-tests.json
          python3 ../../../scripts/ci/journey-gate.py verify-tests \
            --test-results ../../../test-results/kri-559/suggestion-chips-native-tests.json \
            --xctest CreationUITests/testServerSuggestionChipsSendOnTapAndReplaceFixedChips
      - name: Verify both answer orders use one creation turn
        if: matrix.leg == 'screens' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-802-question-batch')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/ios/simulator-id.txt)" \
            -only-testing:KriaUITests/CreationUITests/testTitleCardAndClipPickerInOneReplyGoOutOnOneTurn \
            -only-testing:KriaUITests/CreationUITests/testClipsFirstThenTheTitleTapSendsBothOnOneTurn \
            -resultBundlePath ../../../test-results/kri-559/question-batch-native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/question-batch-native.xcresult \
            > ../../../test-results/kri-559/question-batch-native-tests.json
          python3 ../../../scripts/ci/journey-gate.py verify-tests \
            --test-results ../../../test-results/kri-559/question-batch-native-tests.json \
            --xctest CreationUITests/testTitleCardAndClipPickerInOneReplyGoOutOnOneTurn \
            --xctest CreationUITests/testClipsFirstThenTheTitleTapSendsBothOnOneTurn
      - name: Reuse the same simulator for selected native journeys
        if: needs.changes.outputs.journey_needs_native == 'true'
        run: cp test-results/ios/simulator-id.txt test-results/kri-559/simulator-id.txt
      - name: Render captured creation journey on iPhone simulator
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/fixture
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testCapturedCreationWordsRetimedThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/native.xcresult \
            > ../../../test-results/kri-559/native-test-results.json
          APP_INFO=$(find .derived-data/Build/Products -path '*/Kria.app/Info.plist' -print -quit)
          test -n "$APP_INFO"
          {
            xcodebuild -version
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO"
          } > ../../../test-results/kri-559/app-build.txt
      - name: Verify typography preview/export and personal settings on the built iPhone simulator
        if: matrix.leg == 'screens' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-648-phone-text')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/kri-648
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 600 \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testGenerationPinnedTextStylesPreviewAndExport \
            -only-testing:KriaUITests/AccountPrivacyUITests/testExcludedFontSurvivesPickerReturnSaveAndReopen \
            -only-testing:KriaUITests/AccountPrivacyUITests/testTextPreferenceDraftSurvivesRoleSwitch \
            -only-testing:KriaUITests/AccountPrivacyUITests/testTextPreferencesSaveOffEffectsAndReopen \
            -only-testing:KriaUITests/AccountPrivacyUITests/testTextPreferencesStaleWriteKeepsEditsAndOffersReload \
            -only-testing:KriaUITests/AccountPrivacyUITests/testFinishedEditLearningConsentAcceptAndDisableKeepsApprovedPreference \
            -only-testing:KriaUITests/AccountPrivacyUITests/testFinishedEditLearningDismissAndResetHistory \
            -only-testing:KriaUITests/CreationUITests/testFinishedEditLearningChatAcceptAndDismiss \
            -resultBundlePath ../../../test-results/kri-559/kri-648/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/kri-648/native.xcresult \
            > ../../../test-results/kri-559/kri-648/native-test-results.json
          python3 ../../../scripts/ci/journey-gate.py verify-tests \
            --test-results ../../../test-results/kri-559/kri-648/native-test-results.json \
            --xctest DeviceMontageRenderE2ETests/testGenerationPinnedTextStylesPreviewAndExport \
            --xctest AccountPrivacyUITests/testExcludedFontSurvivesPickerReturnSaveAndReopen \
            --xctest AccountPrivacyUITests/testTextPreferenceDraftSurvivesRoleSwitch \
            --xctest AccountPrivacyUITests/testTextPreferencesSaveOffEffectsAndReopen \
            --xctest AccountPrivacyUITests/testTextPreferencesStaleWriteKeepsEditsAndOffersReload \
            --xctest AccountPrivacyUITests/testFinishedEditLearningConsentAcceptAndDisableKeepsApprovedPreference \
            --xctest AccountPrivacyUITests/testFinishedEditLearningDismissAndResetHistory \
            --xctest CreationUITests/testFinishedEditLearningChatAcceptAndDismiss
      - name: Render approved Unicode hook on the built iPhone simulator
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/approved-hook
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testApprovedUnicodeHookExportsWithoutContextCaptionOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/approved-hook.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/approved-hook.xcresult \
            > ../../../test-results/kri-559/approved-hook-tests.json
          python3 ../../../scripts/ci/journey-gate.py verify-tests \
            --test-results ../../../test-results/kri-559/approved-hook-tests.json \
            --xctest DeviceMontageRenderE2ETests/testApprovedUnicodeHookExportsWithoutContextCaptionOnTheIPhone
      - name: Render trim-save journey on the built iPhone simulator
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/trim-save
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testCompoundWordTrimSavedThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/trim-save/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/trim-save/native.xcresult \
            > ../../../test-results/kri-559/trim-save/native-test-results.json
      - name: Render approved 24-second length journey on the iPhone simulator
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/kri-492
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testApprovedTwentyFourSecondLengthThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/kri-492/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/kri-492/native.xcresult \
            > ../../../test-results/kri-559/kri-492/native-test-results.json
      - name: Require approved-length native journey test to pass
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership')
        run: |
          python3 scripts/ci/journey-gate.py verify-tests \
            --test-results test-results/kri-559/kri-492/native-test-results.json \
            --xctest DeviceMontageRenderE2ETests/testApprovedTwentyFourSecondLengthThenExportOnTheIPhone
      - name: Render delayed extension journey on the built iPhone simulator
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/extend
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testCompoundWordTrimSavedThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/extend/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/extend/native.xcresult \
            > ../../../test-results/kri-559/extend/native-test-results.json
      - name: Verify gameday edit, fifth clip, reopen and export on the built simulator
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-669-gameday')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -parallel-testing-enabled NO \
            -only-testing:KriaUITests/GamedayAddClipUITests/testEditedGamedayAddsFifthClipAndReopensCurrentPreview \
            -resultBundlePath ../../../test-results/kri-559/kri-669/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/kri-669/native.xcresult \
            > ../../../test-results/kri-559/kri-669/native-test-results.json
          python3 ../../../scripts/ci/journey-gate.py verify-tests \
            --test-results ../../../test-results/kri-559/kri-669/native-test-results.json \
            --xctest GamedayAddClipUITests/testEditedGamedayAddsFifthClipAndReopensCurrentPreview
      - name: Record and validate immutable journey evidence
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        env:
          KRIA_JOURNEY_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci/journey-gate.py record-native --fixture test-results/kri-559/fixture --head "$KRIA_JOURNEY_HEAD_SHA" --xcresult test-results/kri-559/native.xcresult --test-results test-results/kri-559/native-test-results.json --render test-results/kri-559/fixture/frames/creation_words_retimed.mp4 --app-build test-results/kri-559/app-build.txt --output test-results/kri-559/journey-evidence.json
          python3 scripts/ci/journey-gate.py validate --evidence test-results/kri-559/journey-evidence.json --head "$KRIA_JOURNEY_HEAD_SHA"
      - name: Verify camera-roll item states, undo and independent idea screens
        if: matrix.leg == 'creation' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-729-camera-roll-recommendations')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/ios/simulator-id.txt)" \
            -parallel-testing-enabled NO \
            -only-testing:KriaUITests/CameraRollCollectionUITests/testEveryItemStateIsVisible \
            -only-testing:KriaUITests/CameraRollCollectionUITests/testUndoTappedWhileTheEventDeleteIsInFlightKeepsItsIdeas \
            -only-testing:KriaUITests/CameraRollCollectionUITests/testDeletingAnIdeaCanBeUndone \
            -only-testing:KriaUITests/CameraRollStoriesUITests/testThreeIdeasRemainIndependentWhenOneIsRejected \
            -resultBundlePath ../../../test-results/kri-559/camera-roll-ui.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/camera-roll-ui.xcresult \
            > ../../../test-results/kri-559/camera-roll-ui-tests.json
          python3 ../../../scripts/ci/journey-gate.py verify-tests \
            --test-results ../../../test-results/kri-559/camera-roll-ui-tests.json \
            --xctest CameraRollCollectionUITests/testEveryItemStateIsVisible \
            --xctest CameraRollCollectionUITests/testUndoTappedWhileTheEventDeleteIsInFlightKeepsItsIdeas \
            --xctest CameraRollCollectionUITests/testDeletingAnIdeaCanBeUndone \
            --xctest CameraRollStoriesUITests/testThreeIdeasRemainIndependentWhenOneIsRejected
      - name: Verify saved originals can finish adding to Visuals
        if: matrix.leg == 'screens' && needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-384-ios-library')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/ios/simulator-id.txt)" \
            -parallel-testing-enabled NO \
            -only-testing:KriaUITests/SavedUploadsUITests/testDeviceOnlyVideoAddsToVisualsFromLocalOriginal \
            -only-testing:KriaUITests/SavedUploadsUITests/testRelinkedOriginalFinishesTheVisualsAdd \
            -resultBundlePath ../../../test-results/kri-559/saved-originals-ui.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/saved-originals-ui.xcresult \
            > ../../../test-results/kri-559/saved-originals-ui-tests.json
          python3 ../../../scripts/ci/journey-gate.py verify-tests \
            --test-results ../../../test-results/kri-559/saved-originals-ui-tests.json \
            --xctest SavedUploadsUITests/testDeviceOnlyVideoAddsToVisualsFromLocalOriginal \
            --xctest SavedUploadsUITests/testRelinkedOriginalFinishesTheVisualsAdd
      - name: Verify selected named native unit journeys
        if: matrix.leg == 'unit' && needs.changes.outputs.journey_needs_native == 'true'
        env:
          JOURNEY_IDS: ${{ needs.changes.outputs.journey_ids }}
          UNIT_EXECUTED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true' }}
        run: |
          extra=()
          if [[ "$UNIT_EXECUTED" == "true" ]]; then extra+=(--require-unit); fi
          python3 scripts/ci/journey-gate.py native-units --ids "$JOURNEY_IDS" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-test-diagnostics-${{ matrix.leg }}
          path: test-results/ios/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload native journey evidence
        if: always() && needs.changes.outputs.journey_needs_native == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kri-559-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}-${{ matrix.leg }}
          path: test-results/kri-559/
          retention-days: 14
          if-no-files-found: error

  # Stable required dependency: unexpected skips and failed selection stay red.
  journey:
    if: >-
      always() && (needs.changes.result != 'success' ||
      needs.changes.outputs.journey == 'true' || needs.changes.outputs.ios == 'true')
    needs: [changes, journey-mapping, journey-offline, journey-library, journey-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected journey dependency to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate-journey
