name: CI

# PRs select affected suites; main keeps portable regression checks.
# Full native journeys run nightly/manual, away from the release lane.
# Required check names stay stable and validate intentional skips explicitly.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# The newest main commit covers earlier ones, so stale runs must not occupy
# runners while PR checks wait. PR commits also supersede earlier attempts.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  lint-suites:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Slowest green run 5.8 min, but the same cached `pip install -e ".[dev]"`
    # took 12.7 min in a green api shard; 25 leaves room for that.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        if: needs.changes.outputs.api == 'true'
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Run API lint
        working-directory: src/apps/api
        run: ruff check .

  # These gates remain present on every PR, including docs-only changes.
  # Their timeouts cover only their own steps (slowest green run ~1 min);
  # waiting on `needs:` happens before the job starts and doesn't count.
  lint:
    if: always()
    needs: [changes, lint-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected lint jobs to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate lint lint-suites

  test-api:
    if: always()
    needs: [changes, test-api-suite, journey, journey-library, creator-contract-replay, shared-motion-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected API tests to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate api test-api-suite
      - name: Require selected KRI-559 journey to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate journey journey
      - name: Require creator-contract replay to pass for API changes
        if: needs.changes.outputs.api == 'true'
        env:
          REPLAY_RESULT: ${{ needs.creator-contract-replay.result }}
        run: test "$REPLAY_RESULT" = success

  ios-contracts:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Test iOS verification orchestration
        run: python3 -m unittest discover -s scripts/ios/tests -v
      - name: Install contract generator dependencies
        working-directory: src/apps/api
        run: pip install -e .
      - name: Verify mobile OpenAPI and shared contracts
        working-directory: src/apps/api
        env:
          STORAGE_BUCKET: nova-test
          DATABASE_URL: postgresql://localhost/test
          REDIS_URL: redis://localhost:6379/0
          INTERNAL_API_KEY: test
        run: python -m app.cli.kria_contracts --check

  # PRs use the same compiled iPhone app for unit, selected UI, and selected
  # native journey scenarios. The iOS workflow keeps main/manual regression.
  build-and-test:
    name: ${{ github.event_name == 'pull_request' && 'build-and-test' || 'PR iPhone gate' }}
    if: always() && github.event_name == 'pull_request'
    needs: [changes, journey, ios-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected iPhone checks to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate ios journey

  # KRI-499: compare every available sanitized successful creator job (up to
  # 100) against an actual base-revision verifier, then run the candidate with
  # its new duration check enforced. Both runs are offline and use no paid API.
  creator-contract-replay:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install offline replay dependencies
        working-directory: src/apps/api
        run: pip install -e '.[dev]'
      - name: Resolve immutable comparison base
        id: comparison-base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="$(git merge-base origin/main HEAD)"
          fi
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::could not resolve an immutable replay base SHA"
            exit 1

          }
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Export actual base verifier outcomes
        env:
          BASE_SHA: ${{ steps.comparison-base.outputs.sha }}
        run: |
          mkdir -p test-results/kri-499/base
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git archive "$BASE_SHA" | tar -x -C test-results/kri-499/base
          PYTHONPATH="$GITHUB_WORKSPACE/test-results/kri-499/base/src/apps/api" \
            STORAGE_BUCKET=replay DATABASE_URL=postgresql://replay@localhost/replay \
            python3 scripts/ci/replay-creator-contracts.py \
              --snapshot scripts/ci/fixtures/kri492-creator-contracts.json \
              --candidate-sha "$BASE_SHA" --base-sha "$BASE_SHA" --export-outcomes \
              --report test-results/kri-499/base-outcomes.json
      - name: Replay candidate creator contracts with enforced duration policy
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          python3 scripts/ci/replay-creator-contracts.py \
            --snapshot scripts/ci/fixtures/kri492-creator-contracts.json \
            --baseline test-results/kri-499/base-outcomes.json \
            --base-sha "${{ steps.comparison-base.outputs.sha }}" \
            --candidate-sha "${{ github.sha }}" \
            --report test-results/kri-499/replay-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kri-499-creator-contract-replay-${{ github.sha }}
          path: test-results/kri-499/
          if-no-files-found: warn
          retention-days: 14

  shared-motion-runtime:
    needs: changes
    if: needs.changes.outputs.shared_motion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.13
      - name: Install shared motion runtime dependencies
        working-directory: src/apps/web
        run: npm ci --no-audit --no-fund
      - name: Cache shared motion runtime dependencies
        working-directory: src/apps/web
        run: |
          deno cache --no-config --node-modules-dir=none \
            npm:@webgpu/types@0.1.21 \
            npm:canvaskit-wasm@0.40.0
          deno cache --no-config --node-modules-dir=none \
            ../../packages/motion-runtime/server/render-sequence.ts \
            ../../packages/motion-runtime/server/render-frame.ts
      - name: Run shared motion runtime contract tests
        working-directory: src/apps/web
        run: npx jest src/__tests__/lib/motion-runtime.test.ts --runInBand

  test-api-suite:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    name: api (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # ~2x the slowest green shard (39.9 min, 2026-10-01, during a slow-mirror
    # apt install); typical is ~8 min. Without it a hang burns GitHub's 360.
    timeout-minutes: 80
    strategy:
      # Both shards must finish so the stable test-api gate aggregates failures.
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nova_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Disable unused Chrome apt source
        run: sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
      - name: Install FFmpeg and Skia runtime libs
        # libegl1 + libgl1 are needed by skia-python (used by
        # app/pipeline/text_overlay_skia.py). On macOS these ship with the OS;
        # the Ubuntu runner needs them installed explicitly or the module
        # import fails with `libEGL.so.1: cannot open shared object file`.
        # apt-install.sh kills and retries a stalled mirror within minutes; the
        # step cap sits above the slowest green install (32 min, slow mirror).
        timeout-minutes: 40
        run: sudo bash scripts/ci/apt-install.sh ffmpeg libegl1 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Verify Alembic upgrade-downgrade roundtrip
        working-directory: src/apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
          REDIS_URL: redis://localhost:6379
          STORAGE_BUCKET: nova-test
          STORAGE_PROVIDER: gcs
          OPENAI_API_KEY: sk-test
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_TEST }}
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: |
          python -m alembic upgrade 0072
          python scripts/verify_content_plan_owner_constraint.py seed-mismatch
          if python -m alembic upgrade 0073; then
            echo "0073 unexpectedly accepted a cross-owner plan/persona row"
            exit 1
          fi
          python scripts/verify_content_plan_owner_constraint.py repair-mismatch
          python -m alembic upgrade 0073
          python scripts/verify_content_plan_owner_constraint.py verify-installed
          python -m alembic downgrade -1
          python -m alembic upgrade 0103
          python scripts/verify_0103_downgrade_state.py seed
          python -m alembic downgrade -1
          python scripts/verify_0103_downgrade_state.py verify
          python -m alembic upgrade head
      - name: Run API test shard with timing reports
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
          REDIS_URL: redis://localhost:6379
          STORAGE_BUCKET: nova-test
          STORAGE_PROVIDER: gcs
          OPENAI_API_KEY: sk-test
          WHISPER_BACKEND: local
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_TEST }}
          WAITLIST_ADMIN_SECRET: test-admin-secret
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: python3 scripts/ci/api-tests.py "${{ matrix.shard }}"

  # KRI-559 executes only incident-corpus journeys selected by ci-changes.
  # An affected source without a mapped fixture fails here, on a cheap Ubuntu
  # runner (KRI-604): the macOS `journey` job needs this job, so an unmapped
  # selection never queues for a macOS runner just to fail in its first step.
  # The `test-api` gate still goes red because a skipped `journey` is not the
  # `success` it requires for a selected suite.
  journey-mapping:
    needs: changes
    if: needs.changes.outputs.journey == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require a mapped incident-corpus journey
        env:
          COVERAGE: ${{ needs.changes.outputs.journey_coverage }}
          JOURNEY_IDS: ${{ needs.changes.outputs.journey_ids }}
        run: python3 scripts/ci/select-tests.py validate-mapping

  journey-library:
    needs: [changes, journey-mapping]
    if: contains(needs.changes.outputs.journey_ids, 'kri-384-library-ingest')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nova_library_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_library_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_PROVIDER: gcs
      STORAGE_BUCKET: nova-test
      OPENAI_API_KEY: sk-test
      GEMINI_API_KEY: test
      WHISPER_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - name: Disable unused Chrome apt source
        run: sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
      - name: Install deterministic media dependencies
        timeout-minutes: 40
        run: sudo bash scripts/ci/apt-install.sh ffmpeg libegl1 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Migrate disposable library database
        working-directory: src/apps/api
        run: python -m alembic upgrade head
      - name: Run owned-library ingest and reuse journey
        working-directory: src/apps/api
        run: |
          set -o pipefail
          mkdir -p ../../../test-results/kri-384-library
          python3 - <<'PY' | tee ../../../test-results/kri-384-library/tests.log
          import json
          import subprocess
          from pathlib import Path
          from xml.etree import ElementTree
          manifest = json.loads(Path("../../../scripts/ci/journey-manifest.json").read_text())
          journey = next(item for item in manifest["journeys"] if item["id"] == "kri-384-library-ingest")
          tests = journey["api_tests"].split()
          if not tests or any(not name.startswith("tests/") or not Path(name).is_file() for name in tests):
              raise SystemExit("Library journey has missing test inputs")
          command = ["python3", "-m", "pytest", *tests, "-s", "--junitxml=../../../test-results/kri-384-library/junit.xml"]
          status = subprocess.call(command)
          if status:
              raise SystemExit(status)
          cases = ElementTree.parse("../../../test-results/kri-384-library/junit.xml").findall(".//testcase")
          for path in tests:
              module = path.removesuffix(".py").replace("/", ".")
              if not any(case.get("classname", "").startswith(module) and case.find("skipped") is None for case in cases):
                  raise SystemExit(f"Library journey did not execute test module: {path}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kri-384-library-journey-${{ github.sha }}
          path: test-results/kri-384-library/
          if-no-files-found: error
          retention-days: 14


  # Python checks and synthetic fixtures fail before allocating a Mac.
  journey-offline:
    needs: [changes, journey-mapping]
    if: needs.changes.outputs.journey == 'true' && needs.journey-mapping.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Prepare journey result directory
        run: mkdir -p test-results/kri-559
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.journey == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      # Match API CI's native Python-library dependencies (Skia imports GL).
      - name: Install portable journey runtime libraries
        run: |
          sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
          sudo bash scripts/ci/apt-install.sh ffmpeg libegl1 libgl1
      - name: Install offline journey dependencies
        if: needs.changes.outputs.journey == 'true'
        working-directory: src/apps/api
        run: pip install -e '.[dev]'
      - name: Verify KRI-492 offline policy and compiled-recipe replay prerequisites
        if: contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
          KRIA_JOURNEY_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 -m pytest tests/services/test_length_policy_state.py \
            tests/services/test_creator_render_contract.py \
            tests/services/test_cloud_render_contract.py -q
          python3 ../../../scripts/ci/replay-creator-contracts.py \
            --snapshot ../../../scripts/ci/fixtures/kri492-creator-contracts.json \
            --candidate-sha "$KRIA_JOURNEY_HEAD_SHA" --export-outcomes \
            --report ../../../test-results/kri-559/kri-492-candidate-outcomes.json
      - name: Require FFmpeg for deterministic fixture media
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation') || contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership')
        run: |
          ffmpeg -version | head -n 1
      - name: Generate and verify offline server journey fixture
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        env:
          KRIA_JOURNEY_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ios/kri-524-creation-e2e.py test-results/kri-559/fixture
          python3 scripts/ios/kri-651-approved-hook-e2e.py test-results/kri-559/approved-hook
          python3 scripts/ios/kri-524-trim-save-e2e.py test-results/kri-559/trim-save
          python3 scripts/ios/kri-524-trim-save-e2e.py test-results/kri-559/extend --extend
          python3 scripts/ci/journey-gate.py verify-input --fixture test-results/kri-559/fixture --head "$KRIA_JOURNEY_HEAD_SHA"
      - name: Generate KRI-492 approved-length fixture through server approval and compiler
        if: contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership')
        run: python3 scripts/ios/kri-492-length-e2e.py test-results/kri-559/kri-492
      - name: Verify Gemini thought streaming journey
        if: contains(needs.changes.outputs.journey_ids, 'kri-557-thinking')
        working-directory: src/apps/api
        run: |
          set -o pipefail
          python3 -m pytest tests/agents/test_thinking_budget.py -q | tee ../../../test-results/kri-559/thought-api-tests.log
      - name: Verify slide-post binding and save validation
        if: contains(needs.changes.outputs.journey_ids, 'slide-post-binding-recovery')
        working-directory: src/apps/api
        run: |
          set -o pipefail
          python3 -m pytest tests/routes/test_slide_post_native_routes.py -q \
            | tee ../../../test-results/kri-559/slide-post-binding-api-tests.log
      - name: Verify song-timeline answer through the lip-sync planner
        if: contains(needs.changes.outputs.journey_ids, 'kri-561-song-order')
        working-directory: src/apps/api
        run: |
          set -o pipefail
          python3 -m pytest tests/pipeline/test_song_order_placements.py \
            tests/routes/test_phone_song_editor_commit.py -q \
            | tee ../../../test-results/kri-559/song-order-api-tests.log
      - name: Run the KRI-577 reliability gates for the changed incident paths
        if: contains(needs.changes.outputs.journey_ids, 'kri-577-reliability-gates')
        run: |
          set -o pipefail
          python3 scripts/reliability-gates.py run --all --python python3 \
            --log test-results/kri-559/reliability-gates.log
      - name: Verify watermark-aware caption compile and its device fixture
        if: contains(needs.changes.outputs.journey_ids, 'kri-548-caption-watermark')
        working-directory: src/apps/api
        run: |
          set -o pipefail
          python3 -m pytest tests/pipeline/test_phone_captions.py \
            tests/pipeline/test_phone_caption_watermark_fixture.py \
            tests/kria/test_portable_text_layout.py -q \
            | tee ../../../test-results/kri-559/caption-watermark-api-tests.log
      - name: Verify the drawing wire and compile contract on the server
        if: contains(needs.changes.outputs.journey_ids, 'kri-589-drawing')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/agents/test_drawing_schema.py \
            tests/kria/test_drawing_compile.py \
            tests/routes/test_slide_post_drawing_routes.py -q \
            | tee ../../../test-results/kri-559/drawing-api-tests.log
      - name: Verify speaker face-fill decision, compile and device fixture
        if: contains(needs.changes.outputs.journey_ids, 'kri-547-speaker-framing')
        working-directory: src/apps/api
        run: |
          set -o pipefail
          python3 -m pytest tests/pipeline/test_kri547_face_fill_device_fixture.py \
            tests/pipeline/test_phone_speaker_framing.py \
            tests/pipeline/test_phone_subtitled_plan.py \
            tests/pipeline/test_phone_subtitled_title.py \
            tests/pipeline/test_render_geometry.py \
            tests/kria/test_speaker_framing_ask.py \
            tests/kria/test_brief_speaker_framing.py \
            tests/tasks/test_phone_subtitled_speaker_framing_worker.py -q \
            | tee ../../../test-results/kri-559/speaker-framing-api-tests.log
      - name: Verify hook-copy decision contract and replay fixtures
        if: contains(needs.changes.outputs.journey_ids, 'kri-586-hook-copy')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/agents/test_main_creator_agent.py \
            tests/agents/test_main_creator_user_song.py \
            tests/agents/test_runtime.py \
            tests/kria/test_creative_copy_planner.py \
            tests/evals/test_main_creator_evals.py -q \
            | tee ../../../test-results/kri-559/hook-copy-api-tests.log
      - name: Verify spoken voiceover cues follow the narration and replay fixtures
        if: contains(needs.changes.outputs.journey_ids, 'kri-590-voiceover-cues')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/agents/test_narrated_clip_alignment.py \
            tests/evals/test_narrated_clip_alignment_evals.py \
            tests/kria/test_brief_checks_narrated_alignment.py \
            tests/kria/test_kri520_block_recovery.py \
            tests/tasks/test_phone_subtitled_narrated_dispatch.py -q \
            | tee ../../../test-results/kri-559/voiceover-cues-api-tests.log
      - name: Verify voiceover planner contract and replay fixtures
        if: contains(needs.changes.outputs.journey_ids, 'kri-598-voiceover-planner')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/kria/test_kri598_voiceover_planner.py \
            tests/kria/test_voiceover_downgrade_losses.py \
            tests/evals/test_clip_intent_planner_evals.py \
            tests/evals/test_main_creator_evals.py -q \
            | tee ../../../test-results/kri-559/voiceover-planner-api-tests.log
      - name: Verify a voiceover edit keeps every clip through the planner and dispatch
        if: contains(needs.changes.outputs.journey_ids, 'kri-593-voiceover-clips')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/kria/test_kri593_voiceover_keeps_every_clip.py -q \
            | tee ../../../test-results/kri-559/voiceover-clips-api-tests.log
      - name: Verify a silent talking take is refused instead of cut to seconds
        if: contains(needs.changes.outputs.journey_ids, 'kri-653-silent-take')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/pipeline/test_silence_cut_no_speech.py \
            tests/services/test_audio_presence.py \
            tests/services/test_transcript_quality.py \
            tests/tasks/test_silent_audio_gate.py -q \
            | tee ../../../test-results/kri-559/silent-take-api-tests.log
      - name: Verify a montage drops the clips the creator ruled out by length
        if: contains(needs.changes.outputs.journey_ids, 'kri-623-ruled-out-clips')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/kria/test_kri623_ruled_out_clips.py -q \
            | tee ../../../test-results/kri-559/ruled-out-clips-api-tests.log
      - name: Verify text Bend survives the phone recipe, the editor ops and the old-client gate
        if: contains(needs.changes.outputs.journey_ids, 'kri-646-text-bend')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/kria/test_text_bend.py -q \
            | tee ../../../test-results/kri-559/text-bend-api-tests.log
      - name: Verify a phone Talking edit starts at the line the creator quotes
        if: contains(needs.changes.outputs.journey_ids, 'kri-628-opening-cut')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          set -o pipefail
          python3 -m pytest tests/pipeline/test_phone_opening_cut.py -q \
            | tee ../../../test-results/kri-559/opening-cut-api-tests.log
      - name: Seal portable fixture inputs for this exact workflow attempt
        if: needs.changes.outputs.journey_needs_native == 'true'
        run: python3 scripts/ci/journey-gate.py seal-bundle --root test-results/kri-559 --head "${{ github.sha }}" --run "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
      - name: Transfer fixture inputs and offline evidence
        if: needs.changes.outputs.journey_needs_native == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fixture-bundle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/kri-559/
          retention-days: 14
          if-no-files-found: error
      - name: Upload portable diagnostics
        if: failure() || needs.changes.outputs.journey_needs_native != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kri-559-offline-${{ github.run_id }}-${{ github.run_attempt }}
          path: test-results/kri-559/
          retention-days: 14
          if-no-files-found: ignore

  journey-native:
    name: iPhone validation
    needs: [changes, journey-mapping, journey-offline, journey-library]
    if: >-
      !cancelled() && needs.changes.result == 'success' && needs.changes.outputs.native_validation == 'true' &&
      ((contains(needs.changes.outputs.journey_ids, 'kri-384-library-ingest') && needs.journey-library.result == 'success') ||
       (!contains(needs.changes.outputs.journey_ids, 'kri-384-library-ingest') && needs.journey-library.result == 'skipped')) &&
      ((needs.changes.outputs.journey == 'true' && needs.journey-mapping.result == 'success' && needs.journey-offline.result == 'success') ||
       (needs.changes.outputs.journey == 'false' && needs.journey-mapping.result == 'skipped' && needs.journey-offline.result == 'skipped'))
    runs-on: macos-15
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Prepare native result directories
        run: mkdir -p test-results/kri-559 test-results/ios
      - name: Download this attempt's portable fixture inputs
        if: needs.changes.outputs.journey_needs_native == 'true'
        uses: actions/download-artifact@v4
        with:
          name: fixture-bundle-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/kri-559/
      - name: Check fixture provenance and transferred bytes
        if: needs.changes.outputs.journey_needs_native == 'true'
        env:
          JOURNEY_IDS: ${{ needs.changes.outputs.journey_ids }}
        run: |
          python3 scripts/ci/journey-gate.py verify-bundle --root test-results/kri-559 --head "${{ github.sha }}" --run "${{ github.run_id }}" --attempt "${{ github.run_attempt }}"
          if [[ ",$JOURNEY_IDS," == *",kri-524-creation,"* ]]; then
            python3 scripts/ci/journey-gate.py verify-input --fixture test-results/kri-559/fixture --head "${{ github.sha }}"
          fi
      - name: Set up Xcode
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        run: brew install xcodegen
      - name: Identify Xcode cache
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        id: xcode-cache
        run: |
          echo "toolchain=$(xcodebuild -version | shasum -a 256 | cut -d ' ' -f 1)" >> "$GITHUB_OUTPUT"
      - name: Restore Xcode build data
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        id: build-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            src/apps/ios/.derived-data/Build
            src/apps/ios/.derived-data/SourcePackages
            src/apps/ios/.derived-data/ModuleCache.noindex
            src/apps/ios/.derived-data/SDKStatCaches.noindex
            src/apps/ios/.derived-data/CompilationCache.noindex
          key: ios-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.toolchain }}-${{ hashFiles('src/apps/ios/project.yml', 'src/apps/ios/**/Package.resolved', 'src/apps/ios/**/Package.swift') }}-${{ github.sha }}
          restore-keys: |
            ios-build-${{ runner.os }}-${{ runner.arch }}-${{ steps.xcode-cache.outputs.toolchain }}-${{ hashFiles('src/apps/ios/project.yml', 'src/apps/ios/**/Package.resolved', 'src/apps/ios/**/Package.swift') }}-
      - name: Build iPhone app and run selected unit tests
        if: needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true'
        env:
          KRIA_IOS_TEST_MODE: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true' && needs.changes.outputs.ios_ui == 'false' && needs.changes.outputs.journey_needs_native == 'false' && 'unit' || 'prepare-ui' }}
          KRIA_IOS_UNIT_TESTS: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true' && '1' || '0' }}
          KRIA_RESTORE_INPUT_TIMES: '1'
        run: bash scripts/ios/verify.sh
      - name: Record compiled iPhone input timestamps
        if: github.event_name == 'pull_request' && (needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true')
        run: python3 scripts/ios/cache-inputs.py save
      - name: Save Xcode build data for the next run
        if: github.event_name == 'pull_request' && (needs.changes.outputs.ios == 'true' || needs.changes.outputs.journey_needs_native == 'true') && steps.build-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            src/apps/ios/.derived-data/Build
            src/apps/ios/.derived-data/SourcePackages
            src/apps/ios/.derived-data/ModuleCache.noindex
            src/apps/ios/.derived-data/SDKStatCaches.noindex
            src/apps/ios/.derived-data/CompilationCache.noindex
          key: ${{ steps.build-cache.outputs.cache-primary-key }}
      - name: Run selected iPhone UI scenarios
        if: github.event_name == 'pull_request' && needs.changes.outputs.ios_ui == 'true'
        env:
          KRIA_IOS_TEST_MODE: ui
          KRIA_IOS_UI_GROUPS: ${{ needs.changes.outputs.ios_ui_groups == 'full' && 'smoke' || needs.changes.outputs.ios_ui_groups }}
        run: bash scripts/ios/verify.sh
      - name: Reuse the same simulator for selected native journeys
        if: needs.changes.outputs.journey_needs_native == 'true'
        run: cp test-results/ios/simulator-id.txt test-results/kri-559/simulator-id.txt
      - name: Render captured creation journey on iPhone simulator
        if: needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/fixture
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testCapturedCreationWordsRetimedThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/native.xcresult \
            > ../../../test-results/kri-559/native-test-results.json
          APP_INFO=$(find .derived-data/Build/Products -path '*/Kria.app/Info.plist' -print -quit)
          test -n "$APP_INFO"
          {
            xcodebuild -version
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO"
          } > ../../../test-results/kri-559/app-build.txt
      - name: Render approved Unicode hook on the built iPhone simulator
        if: needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/approved-hook
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testApprovedUnicodeHookExportsWithoutContextCaptionOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/approved-hook.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/approved-hook.xcresult \
            > ../../../test-results/kri-559/approved-hook-tests.json
          python3 ../../../scripts/ci/journey-gate.py verify-tests \
            --test-results ../../../test-results/kri-559/approved-hook-tests.json \
            --xctest DeviceMontageRenderE2ETests/testApprovedUnicodeHookExportsWithoutContextCaptionOnTheIPhone
      - name: Render trim-save journey on the built iPhone simulator
        if: needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/trim-save
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testCompoundWordTrimSavedThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/trim-save/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/trim-save/native.xcresult \
            > ../../../test-results/kri-559/trim-save/native-test-results.json
      - name: Render approved 24-second length journey on the iPhone simulator
        if: needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/kri-492
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testApprovedTwentyFourSecondLengthThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/kri-492/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/kri-492/native.xcresult \
            > ../../../test-results/kri-559/kri-492/native-test-results.json
      - name: Require approved-length native journey test to pass
        if: needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership')
        run: |
          python3 scripts/ci/journey-gate.py verify-tests \
            --test-results test-results/kri-559/kri-492/native-test-results.json \
            --xctest DeviceMontageRenderE2ETests/testApprovedTwentyFourSecondLengthThenExportOnTheIPhone
      - name: Render delayed extension journey on the built iPhone simulator
        if: needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/extend
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testCompoundWordTrimSavedThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/extend/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/extend/native.xcresult \
            > ../../../test-results/kri-559/extend/native-test-results.json
      - name: Record and validate immutable journey evidence
        if: needs.changes.outputs.journey_needs_native == 'true' && contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        env:
          KRIA_JOURNEY_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci/journey-gate.py record-native --fixture test-results/kri-559/fixture --head "$KRIA_JOURNEY_HEAD_SHA" --xcresult test-results/kri-559/native.xcresult --test-results test-results/kri-559/native-test-results.json --render test-results/kri-559/fixture/frames/creation_words_retimed.mp4 --app-build test-results/kri-559/app-build.txt --output test-results/kri-559/journey-evidence.json
          python3 scripts/ci/journey-gate.py validate --evidence test-results/kri-559/journey-evidence.json --head "$KRIA_JOURNEY_HEAD_SHA"
      - name: Verify selected named native unit journeys
        if: needs.changes.outputs.journey_needs_native == 'true'
        env:
          JOURNEY_IDS: ${{ needs.changes.outputs.journey_ids }}
          UNIT_EXECUTED: ${{ github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true' }}
        run: |
          extra=()
          if [[ "$UNIT_EXECUTED" == "true" ]]; then extra+=(--require-unit); fi
          python3 scripts/ci/journey-gate.py native-units --ids "$JOURNEY_IDS" "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-native-test-diagnostics
          path: test-results/ios/
          retention-days: 7
          if-no-files-found: ignore
      - name: Upload native journey evidence
        if: always() && needs.changes.outputs.journey_needs_native == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: kri-559-native-${{ github.run_id }}-${{ github.run_attempt }}-${{ github.sha }}
          path: test-results/kri-559/
          retention-days: 14
          if-no-files-found: error

  # Stable required dependency: unexpected skips and failed selection stay red.
  journey:
    if: >-
      always() && (needs.changes.result != 'success' ||
      needs.changes.outputs.journey == 'true' || needs.changes.outputs.ios == 'true')
    needs: [changes, journey-mapping, journey-offline, journey-library, journey-native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require every selected journey dependency to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate-journey
