name: CI

# PRs select affected suites; main keeps portable regression checks.
# Full native journeys run nightly/manual, away from the release lane.
# Required check names stay stable and validate intentional skips explicitly.
on:
  schedule:
    - cron: "23 2 * * *"
  workflow_dispatch:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# The newest main commit covers earlier ones, so stale runs must not occupy
# runners while PR checks wait. PR commits also supersede earlier attempts.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.event_name == 'push' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  lint-suites:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Slowest green run 5.8 min, but the same cached `pip install -e ".[dev]"`
    # took 12.7 min in a green api shard; 25 leaves room for that.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        if: needs.changes.outputs.api == 'true'
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Run API lint
        working-directory: src/apps/api
        run: ruff check .

  # These gates remain present on every PR, including docs-only changes.
  # Waiting on `needs:` happens before a job starts and doesn't count toward
  # its timeout. Lint also fetches the immutable evidence-policy baseline.
  lint:
    permissions:
      contents: read
      pull-requests: read
    if: always()
    needs: [changes, lint-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require selected lint jobs to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate lint lint-suites
      - name: Check out trusted PR evidence policy
        if: github.event_name == 'pull_request'
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .pr-evidence-policy
          fetch-depth: 1
          persist-credentials: false
      - name: Read current PR evidence
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" > "$RUNNER_TEMP/current-pr-evidence.json"
          python3 - <<'PYTHON'
          import json
          import os
          from pathlib import Path

          event = json.loads(Path(os.environ["GITHUB_EVENT_PATH"]).read_text())
          current = json.loads((Path(os.environ["RUNNER_TEMP"]) / "current-pr-evidence.json").read_text())
          original = event["pull_request"]
          if (
              current.get("number") != original["number"]
              or current.get("number") != int(os.environ["PR_NUMBER"])
              or current.get("head", {}).get("sha") != os.environ["HEAD_SHA"]
              or current.get("base", {}).get("ref") != original["base"]["ref"]
              or not isinstance(current.get("body"), str)
          ):
              raise SystemExit("Current PR evidence must belong to this PR, head and base branch")
          # Keep this run's immutable diff/base; refresh only the body as inert data.
          original["body"] = current["body"]
          (Path(os.environ["RUNNER_TEMP"]) / "pr-evidence-event.json").write_text(json.dumps(event))
          PYTHON
      - name: Validate request-to-output evidence
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          POLICY_REPO: .pr-evidence-policy
          DIFF_REPO: ${{ github.workspace }}
        run: |
          state="$(python3 - <<'PYTHON'
          import os
          from pathlib import Path
          import subprocess

          paths = ("scripts/ci/pr-evidence.py", ".github/workflows/pr-evidence.yml")
          def entries(repo, revision):
              raw = subprocess.check_output(["git", "-C", repo, "ls-tree", "-z", revision, "--", *paths])
              result = {}
              for entry in raw.split(b"\0"):
                  if entry:
                      metadata, path = entry.decode("utf-8").split("\t", 1)
                      mode, kind, _sha = metadata.split()
                      result[path] = (mode, kind)
              return result

          def regular(value):
              return value in (("100644", "blob"), ("100755", "blob"))

          baseline = entries(os.environ["POLICY_REPO"], os.environ["BASE_SHA"])
          if paths[0] in baseline:
              if not regular(baseline[paths[0]]):
                  raise SystemExit("Baseline evidence validator must be a regular tracked file")
              validator = Path(os.environ["POLICY_REPO"]) / paths[0]
              if not validator.is_file() or validator.is_symlink():
                  raise SystemExit("Baseline evidence validator checkout is missing or invalid")
              print("baseline")
          else:
              candidate = entries(os.environ["DIFF_REPO"], os.environ["HEAD_SHA"])
              if baseline or not all(regular(candidate.get(path)) for path in paths):
                  raise SystemExit("Missing baseline policy: only the first validator + workflow introduction may bootstrap")
              print("bootstrap")
          PYTHON
          )"
          policy=.pr-evidence-policy/scripts/ci/pr-evidence.py
          if [[ "$state" == bootstrap ]]; then
            echo "::notice::initial policy bootstrap: validating the new candidate policy"
            policy=scripts/ci/pr-evidence.py
          fi
          python3 "$policy" --repo "$GITHUB_WORKSPACE" \
            --base "$BASE_SHA" --head "$HEAD_SHA" --event "$RUNNER_TEMP/pr-evidence-event.json"

  test-api:
    if: always()
    needs: [changes, test-api-suite, journey, journey-library, creator-contract-replay, shared-motion-runtime]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected API tests to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate api test-api-suite
      - name: Require selected KRI-559 journey to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate journey journey
      - name: Require creator-contract replay to pass for API changes
        if: needs.changes.outputs.api == 'true'
        env:
          REPLAY_RESULT: ${{ needs.creator-contract-replay.result }}
        run: test "$REPLAY_RESULT" = success

  ios-contracts:
    needs: changes
    if: github.event_name == 'pull_request' && needs.changes.outputs.ios == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Test iOS verification orchestration
        run: python3 -m unittest discover -s scripts/ios/tests -v
      - name: Install contract generator dependencies
        working-directory: src/apps/api
        run: pip install -e .
      - name: Verify mobile OpenAPI and shared contracts
        working-directory: src/apps/api
        env:
          STORAGE_BUCKET: nova-test
          DATABASE_URL: postgresql://localhost/test
          REDIS_URL: redis://localhost:6379/0
          INTERNAL_API_KEY: test
        run: python -m app.cli.kria_contracts --check

  # PRs use the same compiled iPhone app for unit, selected UI, and selected
  # native journey scenarios. The iOS workflow keeps main/manual regression.
  build-and-test:
    name: ${{ github.event_name == 'pull_request' && 'build-and-test' || 'PR iPhone gate' }}
    if: always() && github.event_name == 'pull_request'
    needs: [changes, journey, ios-contracts]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected iPhone checks to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate ios journey

  # KRI-499: compare every available sanitized successful creator job (up to
  # 100) against an actual base-revision verifier, then run the candidate with
  # its new duration check enforced. Both runs are offline and use no paid API.
  creator-contract-replay:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install offline replay dependencies
        working-directory: src/apps/api
        run: pip install -e '.[dev]'
      - name: Resolve immutable comparison base
        id: comparison-base
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base_sha="${{ github.event.pull_request.base.sha }}"
          else
            base_sha="$(git merge-base origin/main HEAD)"
          fi
          [[ "$base_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "::error::could not resolve an immutable replay base SHA"
            exit 1

          }
          echo "sha=$base_sha" >> "$GITHUB_OUTPUT"
      - name: Export actual base verifier outcomes
        env:
          BASE_SHA: ${{ steps.comparison-base.outputs.sha }}
        run: |
          mkdir -p test-results/kri-499/base
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git archive "$BASE_SHA" | tar -x -C test-results/kri-499/base
          PYTHONPATH="$GITHUB_WORKSPACE/test-results/kri-499/base/src/apps/api" \
            STORAGE_BUCKET=replay DATABASE_URL=postgresql://replay@localhost/replay \
            python3 scripts/ci/replay-creator-contracts.py \
              --snapshot scripts/ci/fixtures/kri492-creator-contracts.json \
              --candidate-sha "$BASE_SHA" --base-sha "$BASE_SHA" --export-outcomes \
              --report test-results/kri-499/base-outcomes.json
      - name: Replay candidate creator contracts with enforced duration policy
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
        run: |
          python3 scripts/ci/replay-creator-contracts.py \
            --snapshot scripts/ci/fixtures/kri492-creator-contracts.json \
            --baseline test-results/kri-499/base-outcomes.json \
            --base-sha "${{ steps.comparison-base.outputs.sha }}" \
            --candidate-sha "${{ github.sha }}" \
            --report test-results/kri-499/replay-report.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kri-499-creator-contract-replay-${{ github.sha }}
          path: test-results/kri-499/
          if-no-files-found: warn
          retention-days: 14

  shared-motion-runtime:
    needs: changes
    if: needs.changes.outputs.shared_motion == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.7.13
      - name: Install shared motion runtime dependencies
        working-directory: src/apps/web
        run: npm ci --no-audit --no-fund
      - name: Cache shared motion runtime dependencies
        working-directory: src/apps/web
        run: |
          deno cache --no-config --node-modules-dir=none \
            npm:@webgpu/types@0.1.21 \
            npm:canvaskit-wasm@0.40.0
          deno cache --no-config --node-modules-dir=none \
            ../../packages/motion-runtime/server/render-sequence.ts \
            ../../packages/motion-runtime/server/render-frame.ts
      - name: Run shared motion runtime contract tests
        working-directory: src/apps/web
        run: npx jest src/__tests__/lib/motion-runtime.test.ts --runInBand

  test-api-suite:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    name: api (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # ~2x the slowest green shard (39.9 min, 2026-10-01, during a slow-mirror
    # apt install); typical is ~8 min. Without it a hang burns GitHub's 360.
    timeout-minutes: 80
    strategy:
      # Both shards must finish so the stable test-api gate aggregates failures.
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nova_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Disable unused Chrome apt source
        run: sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
      - name: Install FFmpeg and Skia runtime libs
        # libegl1 + libgl1 are needed by skia-python (used by
        # app/pipeline/text_overlay_skia.py). On macOS these ship with the OS;
        # the Ubuntu runner needs them installed explicitly or the module
        # import fails with `libEGL.so.1: cannot open shared object file`.
        # apt-install.sh kills and retries a stalled mirror within minutes; the
        # step cap sits above the slowest green install (32 min, slow mirror).
        # The composite action caches the .debs so that cost is paid once.
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg libegl1 libgl1 tesseract-ocr tesseract-ocr-tur
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Verify Alembic upgrade-downgrade roundtrip
        working-directory: src/apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
          REDIS_URL: redis://localhost:6379
          STORAGE_BUCKET: nova-test
          STORAGE_PROVIDER: gcs
          OPENAI_API_KEY: sk-test
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_TEST }}
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: |
          python -m alembic upgrade 0072
          python scripts/verify_content_plan_owner_constraint.py seed-mismatch
          if python -m alembic upgrade 0073; then
            echo "0073 unexpectedly accepted a cross-owner plan/persona row"
            exit 1
          fi
          python scripts/verify_content_plan_owner_constraint.py repair-mismatch
          python -m alembic upgrade 0073
          python scripts/verify_content_plan_owner_constraint.py verify-installed
          python -m alembic downgrade -1
          python -m alembic upgrade 0103
          python scripts/verify_0103_downgrade_state.py seed
          python -m alembic downgrade -1
          python scripts/verify_0103_downgrade_state.py verify
          python -m alembic upgrade head
      - name: Run API test shard with timing reports
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
          REDIS_URL: redis://localhost:6379
          STORAGE_BUCKET: nova-test
          STORAGE_PROVIDER: gcs
          OPENAI_API_KEY: sk-test
          WHISPER_BACKEND: local
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_TEST }}
          WAITLIST_ADMIN_SECRET: test-admin-secret
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: python3 scripts/ci/api-tests.py "${{ matrix.shard }}"

  # KRI-559 executes only incident-corpus journeys selected by ci-changes.
  # An affected source without a mapped fixture fails here, on a cheap Ubuntu
  # runner (KRI-604): the macOS `journey` job needs this job, so an unmapped
  # selection never queues for a macOS runner just to fail in its first step.
  # The `test-api` gate still goes red because a skipped `journey` is not the
  # `success` it requires for a selected suite.
  journey-mapping:
    needs: changes
    if: needs.changes.outputs.journey == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require a mapped incident-corpus journey
        env:
          COVERAGE: ${{ needs.changes.outputs.journey_coverage }}
          JOURNEY_IDS: ${{ needs.changes.outputs.journey_ids }}
        run: python3 scripts/ci/select-tests.py validate-mapping

  journey-library:
    needs: [changes, journey-mapping]
    if: contains(needs.changes.outputs.journey_ids, 'kri-384-library-ingest')
    runs-on: ubuntu-latest
    timeout-minutes: 80
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nova_library_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_library_test
      REDIS_URL: redis://localhost:6379/0
      STORAGE_PROVIDER: gcs
      STORAGE_BUCKET: nova-test
      OPENAI_API_KEY: sk-test
      GEMINI_API_KEY: test
      WHISPER_BACKEND: local
    steps:
      - uses: actions/checkout@v4
      - name: Disable unused Chrome apt source
        run: sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
      - name: Install deterministic media dependencies
        # journey-native waits on this job; a crawling mirror here held the Mac
        # back 34 min on 2026-10-23 (run 39956379905), hence the .deb cache.
        timeout-minutes: 40
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg libegl1 libgl1 tesseract-ocr tesseract-ocr-tur
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Migrate disposable library database
        working-directory: src/apps/api
        run: python -m alembic upgrade head
      - name: Run owned-library ingest and reuse journey
        working-directory: src/apps/api
        run: |
          set -o pipefail
          mkdir -p ../../../test-results/kri-384-library
          python3 - <<'PY' | tee ../../../test-results/kri-384-library/tests.log
          import json
          import subprocess
          from pathlib import Path
          from xml.etree import ElementTree
          manifest = json.loads(Path("../../../scripts/ci/journey-manifest.json").read_text())
          journey = next(item for item in manifest["journeys"] if item["id"] == "kri-384-library-ingest")
          tests = journey["api_tests"].split()
          if not tests or any(not name.startswith("tests/") or not Path(name).is_file() for name in tests):
              raise SystemExit("Library journey has missing test inputs")
          command = ["python3", "-m", "pytest", *tests, "-s", "--junitxml=../../../test-results/kri-384-library/junit.xml"]
          status = subprocess.call(command)
          if status:
              raise SystemExit(status)
          cases = ElementTree.parse("../../../test-results/kri-384-library/junit.xml").findall(".//testcase")
          for path in tests:
              module = path.removesuffix(".py").replace("/", ".")
              if not any(case.get("classname", "").startswith(module) and case.find("skipped") is None for case in cases):
                  raise SystemExit(f"Library journey did not execute test module: {path}")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kri-384-library-journey-${{ github.sha }}
          path: test-results/kri-384-library/
          if-no-files-found: error
          retention-days: 14


  # Python checks and synthetic fixtures fail before allocating a Mac.
  journey-offline:
    needs: [changes, journey-mapping]
    if: needs.changes.outputs.journey == 'true' && needs.journey-mapping.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nova_journey_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Prepare journey result directory
        run: mkdir -p test-results/kri-559
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.journey == 'true'
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      # Match API CI's native Python-library dependencies (Skia imports GL).
      - name: Disable unused Chrome apt source
        run: sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
      - name: Install portable journey runtime libraries
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg libegl1 libgl1 tesseract-ocr tesseract-ocr-tur
      - name: Install offline journey dependencies
        if: needs.changes.outputs.journey == 'true'
        working-directory: src/apps/api
        run: pip install -e '.[dev]'
      - name: Verify KRI-492 offline policy and compiled-recipe replay prerequisites
        if: contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership')
        working-directory: src/apps/api
        env:
          PYTHONPATH: ${{ github.workspace }}/src/apps/api
          STORAGE_BUCKET: replay
          DATABASE_URL: postgresql://replay@localhost/replay
          KRIA_JOURNEY_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 -m pytest tests/services/test_length_policy_state.py \
            tests/services/test_creator_render_contract.py \
            tests/services/test_cloud_render_contract.py \
            tests/integration/test_actual_export_verification.py \
            tests/integration/test_actual_export_completion.py \
            tests/routes/test_actual_export_publication.py -q
          python3 ../../../scripts/ci/replay-creator-contracts.py \
            --snapshot ../../../scripts/ci/fixtures/kri492-creator-contracts.json \
            --candidate-sha "$KRIA_JOURNEY_HEAD_SHA" --export-outcomes \
            --report ../../../test-results/kri-559/kri-492-candidate-outcomes.json
      - name: Require FFmpeg for deterministic fixture media
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation') || contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership') || contains(needs.changes.outputs.journey_ids, 'kri-648-phone-text')
        run: |
          ffmpeg -version | head -n 1
      - name: Generate and verify offline server journey fixture
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        env:
          KRIA_JOURNEY_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ios/kri-524-creation-e2e.py test-results/kri-559/fixture
          python3 scripts/ios/kri-651-approved-hook-e2e.py test-results/kri-559/approved-hook
          python3 scripts/ios/kri-524-trim-save-e2e.py test-results/kri-559/trim-save
          python3 scripts/ios/kri-524-trim-save-e2e.py test-results/kri-559/extend --extend
          python3 scripts/ci/journey-gate.py verify-input --fixture test-results/kri-559/fixture --head "$KRIA_JOURNEY_HEAD_SHA"
      - name: Generate KRI-492 approved-length fixture through server approval and compiler
        if: contains(needs.changes.outputs.journey_ids, 'kri-492-length-ownership')
        run: python3 scripts/ios/kri-492-length-e2e.py test-results/kri-559/kri-492
