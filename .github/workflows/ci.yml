name: CI

# Disposable diagnostic branch only. This workflow is not a shipping gate.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: account-picker-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  account-picker-probe:
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.3'
      - name: Prepare exact hosted simulator and unchanged test
        run: |
          set -euo pipefail
          mkdir -p test-results/account-picker-probe
          xcodebuild -version | tee test-results/account-picker-probe/xcode-version.txt
          python3 - <<'PYCODE'
          from pathlib import Path
          version = Path("test-results/account-picker-probe/xcode-version.txt").read_text()
          assert "Build version 17C529" in version, "Hosted toolchain differs from the original failed run"
          PYCODE
          xcrun simctl list devices available --json > test-results/account-picker-probe/devices.json
          python3 - <<'PYCODE'
          import json, re, subprocess
          from pathlib import Path
          root = Path("test-results/account-picker-probe")
          devices = json.loads((root / "devices.json").read_text())["devices"]
          candidates = [d for runtime, rows in devices.items() if runtime.endswith(".iOS-26-2") for d in rows if d["name"] == "iPhone 17 Pro" and d.get("isAvailable")]
          assert candidates, "Exact original iOS 26.2 / iPhone 17 Pro environment is unavailable; do not substitute another runtime"
          probe_id = candidates[0]["udid"]
          assert re.fullmatch(r"[0-9A-Fa-f-]{36}", probe_id)
          (root / "simulator-id.txt").write_text(probe_id + "\n")
          print("Exact diagnostic simulator:", probe_id)
          if candidates[0]["state"] != "Booted":
              subprocess.run(["xcrun", "simctl", "boot", probe_id], check=True)
          subprocess.run(["xcrun", "simctl", "bootstatus", probe_id, "-b"], check=True)
          PYCODE
          command -v xcodegen || brew install xcodegen
          bash scripts/ios/generate-project.sh
      - name: Download the sealed original native fixture without rerunning backend tests
        uses: actions/download-artifact@v4
        with:
          name: fixture-bundle-39814549006-1-ae44eefe832d292c1cd276648497fe7232ec3e83
          run-id: 39814549006
          github-token: ${{ github.token }}
          path: test-results/kri-559
      - name: Verify the original fixture producer and transferred bytes
        run: |
          python3 scripts/ci/journey-gate.py verify-bundle --root test-results/kri-559 \
            --head ae44eefe832d292c1cd276648497fe7232ec3e83 --run 39814549006 --attempt 1
      - name: Build the traced app and original unchanged test
        id: build
        working-directory: src/apps/ios
        run: |
          set -euo pipefail
          probe_id="$(cat ../../../test-results/account-picker-probe/simulator-id.txt)"
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$probe_id" \
            build-for-testing 2>&1 | tee ../../../test-results/account-picker-probe/build.log
      - name: Observe ten samples without automatic retries or weaker assertions
        working-directory: src/apps/ios
        run: |
          set -euo pipefail
          probe_id="$(cat ../../../test-results/account-picker-probe/simulator-id.txt)"
          xcrun simctl spawn "$probe_id" log stream --level debug --style compact \
            --predicate 'eventMessage CONTAINS "[ACCOUNT-PICKER-PROBE]"' \
            > ../../../test-results/account-picker-probe/standalone-state.log 2>&1 &
          probe_log_pid=$!
          trap 'kill "$probe_log_pid" 2>/dev/null || true; wait "$probe_log_pid" 2>/dev/null || true' EXIT
          probe_exit=0
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$probe_id" \
            -parallel-testing-enabled NO \
            -only-testing:KriaUITests/AccountPrivacyUITests/testFinishedEditLearningConsentAcceptAndDisableKeepsApprovedPreference \
            -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 \
            -maximum-test-execution-time-allowance 600 \
            -test-iterations 10 \
            -resultBundlePath ../../../test-results/account-picker-probe/native.xcresult \
            test-without-building 2>&1 | tee ../../../test-results/account-picker-probe/test.log || probe_exit=$?
          export_exit=0
          xcrun xcresulttool get test-results tests \
            --path ../../../test-results/account-picker-probe/native.xcresult \
            > ../../../test-results/account-picker-probe/tests.json || export_exit=$?
          if [ "$probe_exit" -ne 0 ]; then exit "$probe_exit"; fi
          exit "$export_exit"
      - name: Observe the original six-test typography and consent invocation
        if: always() && steps.build.outcome == 'success'
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/kri-648
        run: |
          set -euo pipefail
          probe_id="$(cat ../../../test-results/account-picker-probe/simulator-id.txt)"
          xcrun simctl spawn "$probe_id" log stream --level debug --style compact \
            --predicate 'eventMessage CONTAINS "[ACCOUNT-PICKER-PROBE]"' \
            > ../../../test-results/account-picker-probe/context-state.log 2>&1 &
          probe_log_pid=$!
          trap 'kill "$probe_log_pid" 2>/dev/null || true; wait "$probe_log_pid" 2>/dev/null || true' EXIT
          context_exit=0
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$probe_id" \
            -parallel-testing-enabled NO -test-timeouts-enabled YES \
            -default-test-execution-time-allowance 180 -maximum-test-execution-time-allowance 600 \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testGenerationPinnedTextStylesPreviewAndExport \
            -only-testing:KriaUITests/AccountPrivacyUITests/testTextPreferencesSaveOffEffectsAndReopen \
            -only-testing:KriaUITests/AccountPrivacyUITests/testTextPreferencesStaleWriteKeepsEditsAndOffersReload \
            -only-testing:KriaUITests/AccountPrivacyUITests/testFinishedEditLearningConsentAcceptAndDisableKeepsApprovedPreference \
            -only-testing:KriaUITests/AccountPrivacyUITests/testFinishedEditLearningDismissAndResetHistory \
            -only-testing:KriaUITests/CreationUITests/testFinishedEditLearningChatAcceptAndDismiss \
            -resultBundlePath ../../../test-results/account-picker-probe/context.xcresult \
            test-without-building 2>&1 | tee ../../../test-results/account-picker-probe/context.log || context_exit=$?
          export_exit=0
          xcrun xcresulttool get test-results tests \
            --path ../../../test-results/account-picker-probe/context.xcresult \
            > ../../../test-results/account-picker-probe/context-tests.json || export_exit=$?
          if [ "$context_exit" -ne 0 ]; then exit "$context_exit"; fi
          exit "$export_exit"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: account-picker-probe-${{ github.run_id }}-${{ github.sha }}
          path: test-results/account-picker-probe
          retention-days: 7
