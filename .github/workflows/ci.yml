name: CI

# PRs select affected suites; main always runs full regression coverage.
# Required check names stay stable and validate intentional skips explicitly.
on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]

# Superseded PR commits should not keep consuming runners. Main runs finish.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    uses: ./.github/workflows/ci-changes.yml

  lint-suites:
    needs: changes
    if: needs.changes.outputs.web == 'true' || needs.changes.outputs.api == 'true'
    runs-on: ubuntu-latest
    # Slowest green run 5.8 min, but the same cached `pip install -e ".[dev]"`
    # took 12.7 min in a green api shard; 25 leaves room for that.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.web == 'true'
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - name: Install web dependencies
        if: needs.changes.outputs.web == 'true'
        working-directory: src/apps/web
        run: npm ci --no-audit --no-fund
      - uses: actions/setup-python@v5
        if: needs.changes.outputs.api == 'true'
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        if: needs.changes.outputs.api == 'true'
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Run web lint
        if: needs.changes.outputs.web == 'true'
        working-directory: src/apps/web
        run: npm run lint
      - name: Run API lint
        if: needs.changes.outputs.api == 'true'
        working-directory: src/apps/api
        run: ruff check .

  test-web-suites:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    name: web (${{ matrix.group }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        group: [interaction-1, interaction-2, interaction-3, interaction-4, remaining]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: src/apps/web/package-lock.json
      - uses: denoland/setup-deno@v2
        if: matrix.group == 'remaining'
        with:
          deno-version: v2.7.13
      - name: Install web dependencies
        working-directory: src/apps/web
        run: npm ci --no-audit --no-fund
      - name: Cache offline CanvasKit motion dependencies
        if: matrix.group == 'remaining'
        working-directory: src/apps/web
        run: |
          deno cache --no-config --node-modules-dir=none \
            npm:@webgpu/types@0.1.21 \
            npm:canvaskit-wasm@0.40.0
          deno cache --no-config --node-modules-dir=none \
            ../../packages/motion-runtime/server/render-sequence.ts \
            ../../packages/motion-runtime/server/render-frame.ts
      - name: Verify CI runner contracts
        run: node --test scripts/ci/web-tests.test.mjs
      - name: Run web tests with timing reports
        run: node scripts/ci/web-tests.mjs "${{ matrix.group }}"
      - name: Upload web test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: web-tests-${{ matrix.group }}-${{ github.run_attempt }}
          path: test-results/web/
          if-no-files-found: warn
      - name: Record job outcome
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
        run: echo "Web group ${{ matrix.group }} job outcome (including setup) $JOB_STATUS" >> "$GITHUB_STEP_SUMMARY"

  # These gates remain present on every PR, including docs-only changes.
  # Their timeouts cover only their own steps (slowest green run ~1 min);
  # waiting on `needs:` happens before the job starts and doesn't count.
  lint:
    if: always()
    needs: [changes, lint-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected lint jobs to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate lint lint-suites

  test-web:
    if: always()
    needs: [changes, test-web-suites]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected web suites to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate web test-web-suites

  test-api:
    if: always()
    needs: [changes, test-api-suite, journey]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require selected API tests to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate api test-api-suite
      - name: Require selected KRI-559 journey to pass
        env:
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/select-tests.py gate journey journey

  test-api-suite:
    needs: changes
    if: needs.changes.outputs.api == 'true'
    name: api (${{ matrix.shard }})
    runs-on: ubuntu-latest
    # ~2x the slowest green shard (39.9 min, 2026-10-01, during a slow-mirror
    # apt install); typical is ~8 min. Without it a hang burns GitHub's 360.
    timeout-minutes: 80
    strategy:
      # Both shards must finish so the stable test-api gate aggregates failures.
      fail-fast: false
      matrix:
        shard: [0, 1]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: nova_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Disable unused Chrome apt source
        run: sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
      - name: Install FFmpeg and Skia runtime libs
        # libegl1 + libgl1 are needed by skia-python (used by
        # app/pipeline/text_overlay_skia.py). On macOS these ship with the OS;
        # the Ubuntu runner needs them installed explicitly or the module
        # import fails with `libEGL.so.1: cannot open shared object file`.
        # apt-install.sh kills and retries a stalled mirror within minutes; the
        # step cap sits above the slowest green install (32 min, slow mirror).
        timeout-minutes: 40
        run: sudo bash scripts/ci/apt-install.sh ffmpeg libegl1 libgl1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install API dependencies
        working-directory: src/apps/api
        run: pip install -e ".[dev]"
      - name: Verify Alembic upgrade-downgrade roundtrip
        working-directory: src/apps/api
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
          REDIS_URL: redis://localhost:6379
          STORAGE_BUCKET: nova-test
          STORAGE_PROVIDER: gcs
          OPENAI_API_KEY: sk-test
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_TEST }}
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: |
          python -m alembic upgrade 0072
          python scripts/verify_content_plan_owner_constraint.py seed-mismatch
          if python -m alembic upgrade 0073; then
            echo "0073 unexpectedly accepted a cross-owner plan/persona row"
            exit 1
          fi
          python scripts/verify_content_plan_owner_constraint.py repair-mismatch
          python -m alembic upgrade 0073
          python scripts/verify_content_plan_owner_constraint.py verify-installed
          python -m alembic downgrade -1
          python -m alembic upgrade 0103
          python scripts/verify_0103_downgrade_state.py seed
          python -m alembic downgrade -1
          python scripts/verify_0103_downgrade_state.py verify
          python -m alembic upgrade head
      - name: Run API test shard with timing reports
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nova_test
          REDIS_URL: redis://localhost:6379
          STORAGE_BUCKET: nova-test
          STORAGE_PROVIDER: gcs
          OPENAI_API_KEY: sk-test
          WHISPER_BACKEND: local
          TOKEN_ENCRYPTION_KEY: ${{ secrets.TOKEN_ENCRYPTION_KEY_TEST }}
          WAITLIST_ADMIN_SECRET: test-admin-secret
          ALLOWED_ORIGINS: '["http://localhost:3000"]'
        run: python3 scripts/ci/api-tests.py "${{ matrix.shard }}"

  # KRI-559 executes only incident-corpus journeys selected by ci-changes.
  # An affected source without a mapped fixture fails in the first step.
  journey:
    needs: changes
    if: needs.changes.outputs.journey == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Require a mapped incident-corpus journey
        env:
          COVERAGE: ${{ needs.changes.outputs.journey_coverage }}
          JOURNEY_IDS: ${{ needs.changes.outputs.journey_ids }}
        run: |
          python3 - <<'PY'
          import os
          selected = os.environ["JOURNEY_IDS"].split(",")
          allowed = {"kri-524-creation", "kri-557-thinking", "slide-post-binding-recovery", "kri-561-song-order", "kri-547-speaker-framing"}
          if os.environ["COVERAGE"] != "covered" or not selected or len(selected) != len(set(selected)) or not set(selected) <= allowed:
              raise SystemExit("Journey selection has an unmapped or invalid incident")
          PY
      - name: Set up Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install offline journey dependencies
        working-directory: src/apps/api
        run: pip install -e '.[dev]'
      - name: Require FFmpeg for deterministic fixture media
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        run: |
          command -v ffmpeg >/dev/null || brew install ffmpeg
          ffmpeg -version | head -n 1
      - name: Generate and verify offline server journey fixture
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        env:
          KRIA_JOURNEY_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ios/kri-524-creation-e2e.py test-results/kri-559/fixture
          python3 scripts/ios/kri-524-trim-save-e2e.py test-results/kri-559/trim-save
          python3 scripts/ios/kri-524-trim-save-e2e.py test-results/kri-559/extend --extend
          python3 scripts/ci/journey-gate.py verify-input --fixture test-results/kri-559/fixture --head "$KRIA_JOURNEY_HEAD_SHA"
      - name: Generate iOS project and select simulator
        run: |
          mkdir -p test-results/kri-559
          bash scripts/ios/generate-project.sh
          xcrun simctl list devices available -j > test-results/kri-559/simulators.json
          python3 - <<'PY' > test-results/kri-559/simulator-id.txt
          import json
          for devices in reversed(list(json.load(open("test-results/kri-559/simulators.json"))["devices"].values())):
              for device in devices:
                  if device.get("isAvailable") and device["name"].startswith("iPhone"):
                      print(device["udid"]); raise SystemExit
          raise SystemExit("No available iPhone simulator")
          PY
          xcrun simctl boot "$(cat test-results/kri-559/simulator-id.txt)" || true
          xcrun simctl bootstatus "$(cat test-results/kri-559/simulator-id.txt)" -b
      - name: Render captured creation journey on iPhone simulator
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/fixture
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testCapturedCreationWordsRetimedThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/native.xcresult test
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/native.xcresult \
            > ../../../test-results/kri-559/native-test-results.json
          APP_INFO=$(find .derived-data/Build/Products -path '*/Kria.app/Info.plist' -print -quit)
          test -n "$APP_INFO"
          {
            xcodebuild -version
            /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP_INFO"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP_INFO"
            /usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP_INFO"
          } > ../../../test-results/kri-559/app-build.txt
      - name: Render trim-save journey on the built iPhone simulator
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/trim-save
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testCompoundWordTrimSavedThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/trim-save/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/trim-save/native.xcresult \
            > ../../../test-results/kri-559/trim-save/native-test-results.json
      - name: Render delayed extension journey on the built iPhone simulator
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        working-directory: src/apps/ios
        env:
          TEST_RUNNER_KRIA_E2E_DIR: ${{ github.workspace }}/test-results/kri-559/extend
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceMontageRenderE2ETests/testCompoundWordTrimSavedThenExportOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/extend/native.xcresult test-without-building
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/extend/native.xcresult \
            > ../../../test-results/kri-559/extend/native-test-results.json
      - name: Record and validate immutable journey evidence
        if: contains(needs.changes.outputs.journey_ids, 'kri-524-creation')
        env:
          KRIA_JOURNEY_HEAD_SHA: ${{ github.sha }}
        run: |
          python3 scripts/ci/journey-gate.py record-native --fixture test-results/kri-559/fixture --head "$KRIA_JOURNEY_HEAD_SHA" --xcresult test-results/kri-559/native.xcresult --test-results test-results/kri-559/native-test-results.json --render test-results/kri-559/fixture/frames/creation_words_retimed.mp4 --app-build test-results/kri-559/app-build.txt --output test-results/kri-559/journey-evidence.json
          python3 scripts/ci/journey-gate.py validate --evidence test-results/kri-559/journey-evidence.json --head "$KRIA_JOURNEY_HEAD_SHA"
      - name: Verify Gemini thought streaming journey
        if: contains(needs.changes.outputs.journey_ids, 'kri-557-thinking')
        working-directory: src/apps/api
        run: |
          set -o pipefail
          python3 -m pytest tests/agents/test_thinking_budget.py -q | tee ../../../test-results/kri-559/thought-api-tests.log
      - name: Verify native thought disclosure, live updates, and reopened history
        if: contains(needs.changes.outputs.journey_ids, 'kri-557-thinking')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/ChatTimelineTests/testCompletedThoughtIsPlacedAfterItsUserRequestBeforeReply \
            -only-testing:KriaTests/SlidePostTests/testProposalShowsStreamingSummaryBeforeReplyAndCompletesHistory \
            -only-testing:KriaTests/SlidePostChatEditTests/testCompletedChatEditThoughtRemainsWithReplyAfterReopening \
            -resultBundlePath ../../../test-results/kri-559/thought-native.xcresult test
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/thought-native.xcresult \
            > ../../../test-results/kri-559/thought-native-test-results.json
      - name: Require each native thought journey test to pass
        if: contains(needs.changes.outputs.journey_ids, 'kri-557-thinking')
        run: |
          python3 scripts/ci/journey-gate.py verify-tests \
            --test-results test-results/kri-559/thought-native-test-results.json \
            --xctest ChatTimelineTests/testCompletedThoughtIsPlacedAfterItsUserRequestBeforeReply \
            --xctest SlidePostTests/testProposalShowsStreamingSummaryBeforeReplyAndCompletesHistory \
            --xctest SlidePostChatEditTests/testCompletedChatEditThoughtRemainsWithReplyAfterReopening
      - name: Verify slide-post binding and save validation
        if: contains(needs.changes.outputs.journey_ids, 'slide-post-binding-recovery')
        working-directory: src/apps/api
        run: |
          set -o pipefail
          python3 -m pytest tests/routes/test_slide_post_native_routes.py -q \
            | tee ../../../test-results/kri-559/slide-post-binding-api-tests.log
      - name: Verify iOS binding round trip through chat and save requests
        if: contains(needs.changes.outputs.journey_ids, 'slide-post-binding-recovery')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/SlidePostTests/testSlidePostBindingNumericRoundTripPreservesDraftInChatAndSave \
            -resultBundlePath ../../../test-results/kri-559/slide-post-binding-native.xcresult test
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/slide-post-binding-native.xcresult \
            > ../../../test-results/kri-559/slide-post-binding-native-test-results.json
      - name: Require native slide-post binding journey to pass
        if: contains(needs.changes.outputs.journey_ids, 'slide-post-binding-recovery')
        run: |
          python3 scripts/ci/journey-gate.py verify-tests \
            --test-results test-results/kri-559/slide-post-binding-native-test-results.json \
            --xctest SlidePostTests/testSlidePostBindingNumericRoundTripPreservesDraftInChatAndSave
      - name: Verify song-timeline answer through the lip-sync planner
        if: contains(needs.changes.outputs.journey_ids, 'kri-561-song-order')
        working-directory: src/apps/api
        run: |
          set -o pipefail
          python3 -m pytest tests/pipeline/test_song_order_placements.py \
            tests/routes/test_phone_song_editor_commit.py -q \
            | tee ../../../test-results/kri-559/song-order-api-tests.log
      - name: Verify native song-timeline submission, parsing and tiling
        if: contains(needs.changes.outputs.journey_ids, 'kri-561-song-order')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/SongOrderTests/testSubmissionListsPlacedTakesByTimeThenTheTrayInCaptureOrderAndEveryTakeOnce \
            -only-testing:KriaTests/SongOrderTests/testOldServerPayloadWithNoNewFieldsStillParsesAndGivesATimelineWithDefaults \
            -only-testing:KriaTests/SongOrderTests/testExtendingThePreviousBlockBy099IsHiddenAndBy1sIsVisible \
            -resultBundlePath ../../../test-results/kri-559/song-order-native.xcresult test
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/song-order-native.xcresult \
            > ../../../test-results/kri-559/song-order-native-test-results.json
      - name: Require native song-order journey tests to pass
        if: contains(needs.changes.outputs.journey_ids, 'kri-561-song-order')
        run: |
          python3 scripts/ci/journey-gate.py verify-tests \
            --test-results test-results/kri-559/song-order-native-test-results.json \
            --xctest SongOrderTests/testSubmissionListsPlacedTakesByTimeThenTheTrayInCaptureOrderAndEveryTakeOnce \
            --xctest SongOrderTests/testOldServerPayloadWithNoNewFieldsStillParsesAndGivesATimelineWithDefaults \
            --xctest SongOrderTests/testExtendingThePreviousBlockBy099IsHiddenAndBy1sIsVisible
      - name: Verify speaker face-fill decision, compile and device fixture
        if: contains(needs.changes.outputs.journey_ids, 'kri-547-speaker-framing')
        working-directory: src/apps/api
        run: |
          set -o pipefail
          python3 -m pytest tests/pipeline/test_kri547_face_fill_device_fixture.py \
            tests/pipeline/test_phone_speaker_framing.py \
            tests/pipeline/test_phone_subtitled_plan.py \
            tests/pipeline/test_phone_subtitled_title.py \
            tests/pipeline/test_render_geometry.py \
            tests/kria/test_speaker_framing_ask.py \
            tests/kria/test_brief_speaker_framing.py \
            tests/tasks/test_phone_subtitled_speaker_framing_worker.py -q \
            | tee ../../../test-results/kri-559/speaker-framing-api-tests.log
      - name: Render the server face-fill crop and measure it on the iPhone simulator
        if: contains(needs.changes.outputs.journey_ids, 'kri-547-speaker-framing')
        working-directory: src/apps/ios
        run: |
          xcodebuild -project Kria.xcodeproj -scheme Kria -skipPackagePluginValidation \
            -derivedDataPath .derived-data CODE_SIGNING_ALLOWED=NO \
            -destination "platform=iOS Simulator,id=$(cat ../../../test-results/kri-559/simulator-id.txt)" \
            -only-testing:KriaTests/DeviceSpeakerFaceFillE2ETests/testFaceInTheLeftThirdShowsTheServerWindowOnTheIPhone \
            -only-testing:KriaTests/DeviceSpeakerFaceFillE2ETests/testFaceAtTheRightEdgeClampsWithNoBlackEdgeOnTheIPhone \
            -only-testing:KriaTests/DeviceSpeakerFaceFillE2ETests/testCentredFaceIsTheUnshiftedCentreCropOnTheIPhone \
            -resultBundlePath ../../../test-results/kri-559/speaker-framing-native.xcresult test
          xcrun xcresulttool get test-results tests --path ../../../test-results/kri-559/speaker-framing-native.xcresult \
            > ../../../test-results/kri-559/speaker-framing-native-test-results.json
      - name: Require native speaker face-fill journey tests to pass
        if: contains(needs.changes.outputs.journey_ids, 'kri-547-speaker-framing')
        run: |
          python3 scripts/ci/journey-gate.py verify-tests \
            --test-results test-results/kri-559/speaker-framing-native-test-results.json \
            --xctest DeviceSpeakerFaceFillE2ETests/testFaceInTheLeftThirdShowsTheServerWindowOnTheIPhone \
            --xctest DeviceSpeakerFaceFillE2ETests/testFaceAtTheRightEdgeClampsWithNoBlackEdgeOnTheIPhone \
            --xctest DeviceSpeakerFaceFillE2ETests/testCentredFaceIsTheUnshiftedCentreCropOnTheIPhone
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kri-559-journey-${{ github.sha }}
          path: test-results/kri-559/
          if-no-files-found: warn
          retention-days: 14
