name: TestFlight

# The iOS workflow releases a main commit as soon as its build and unit tests
# pass: its first native leg dispatches this workflow while the long UI suite
# keeps running as a report-only check on main. Dispatch needs write access and
# iOS no longer runs on pull_request, so TestFlight credentials stay out of
# reach of pull requests.
on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Main commit whose build and unit tests passed
        required: true
        type: string

permissions:
  actions: read
  contents: read

concurrency:
  group: testflight-production
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-15
    timeout-minutes: 120
    environment: testflight-production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Release the tested main commit when iOS inputs changed since the last upload
        id: gate
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          git fetch origin main --unshallow 2>/dev/null || git fetch origin main
          if [ "$(git rev-parse HEAD)" != "$HEAD_SHA" ]; then
            echo "::error::checkout does not match requested source"
            exit 1
          fi
          # Releasing the exact tested SHA is monotonic even when main has since
          # moved on.  Refuse a SHA that is no longer on main (force-push), and
          # skip one that an earlier upload already contains (out-of-order or
          # duplicate dispatch).
          if ! git merge-base --is-ancestor "$HEAD_SHA" FETCH_HEAD; then
            echo "::error::stale head_sha $HEAD_SHA is not an ancestor of origin/main"
            exit 1
          fi
          # Resolve actual checkout + transfer evidence, including legacy runs.
          # Unknown history blocks release; workflow headSha is not binary provenance.
          # Older tested sources may predate this helper. Use the workflow's
          # policy revision for code only, never as uploaded binary evidence.
          git show "$GITHUB_SHA:scripts/ios/upload_provenance.py" > "$RUNNER_TEMP/testflight-upload-provenance.py"
          provenance="$(python3 "$RUNNER_TEMP/testflight-upload-provenance.py")"
          read -r base superseded <<< "$provenance"
          if [ "$superseded" = "true" ]; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "requires_api_deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: a newer or identical commit was already uploaded."
            exit 0
          fi
          echo "Comparing release inputs since ${base}"
          if git diff --quiet "$base" "$HEAD_SHA" -- \
            src/apps/ios \
            scripts/ios \
            .github/workflows/ios.yml \
            .github/workflows/testflight.yml \
            .claude/worktrees \
            src/apps/api/app/config.py \
            src/apps/api/app/services/mobile_auth.py; then
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "Skipping: no iOS release input changed since the last upload."
          else
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          fi
          if git diff --quiet "$base" "$HEAD_SHA" -- \
            src/apps/api \
            src/packages/motion-runtime \
            Dockerfile \
            .dockerignore \
            fly.toml \
            scripts/fly-deploy-with-retry.sh; then
            echo "requires_api_deploy=false" >> "$GITHUB_OUTPUT"
          else
            echo "requires_api_deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Wait for a production API deploy that contains this commit
        if: steps.gate.outputs.eligible == 'true' && steps.gate.outputs.requires_api_deploy == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # A superseded Fly deploy can be cancelled, so accept any successful deploy
          # of this commit or a later one on main.
          for attempt in $(seq 1 120); do
            for deployed_sha in $(gh run list --workflow 'Fly Deploy' --branch main --status success --limit 30 --json headSha --jq '.[].headSha'); do
              status="$(gh api "repos/$REPO/compare/$HEAD_SHA...$deployed_sha" --jq .status 2>/dev/null || true)"
              if [ "$status" = "identical" ] || [ "$status" = "ahead" ]; then
                echo "Production API deploy $deployed_sha contains $HEAD_SHA"
                exit 0
              fi
            done
            sleep 30
          done
          echo "::error::no Fly Deploy containing $HEAD_SHA completed before TestFlight distribution"
          exit 1

      - name: Validate release configuration
        if: steps.gate.outputs.eligible == 'true'
        env:
          KRIA_DEVELOPMENT_TEAM: ${{ vars.KRIA_DEVELOPMENT_TEAM }}
          KRIA_PROVISIONING_PROFILE_SPECIFIER: ${{ vars.KRIA_PROVISIONING_PROFILE_SPECIFIER }}
          KRIA_GOOGLE_CLIENT_ID: ${{ vars.KRIA_GOOGLE_CLIENT_ID }}
          KRIA_GOOGLE_REDIRECT_SCHEME: ${{ vars.KRIA_GOOGLE_REDIRECT_SCHEME }}
          KRIA_TESTFLIGHT_GROUP: ${{ vars.KRIA_TESTFLIGHT_GROUP }}
          KRIA_BETA_APP_DESCRIPTION: ${{ vars.KRIA_BETA_APP_DESCRIPTION }}
          KRIA_BETA_FEEDBACK_EMAIL: ${{ vars.KRIA_BETA_FEEDBACK_EMAIL }}
          KRIA_BETA_REVIEW_CONTACT_EMAIL: ${{ vars.KRIA_BETA_REVIEW_CONTACT_EMAIL }}
          KRIA_BETA_REVIEW_CONTACT_FIRST_NAME: ${{ vars.KRIA_BETA_REVIEW_CONTACT_FIRST_NAME }}
          KRIA_BETA_REVIEW_CONTACT_LAST_NAME: ${{ vars.KRIA_BETA_REVIEW_CONTACT_LAST_NAME }}
          KRIA_BETA_REVIEW_CONTACT_PHONE: ${{ vars.KRIA_BETA_REVIEW_CONTACT_PHONE }}
          KRIA_BETA_REVIEW_NOTES: ${{ vars.KRIA_BETA_REVIEW_NOTES }}
          KRIA_BETA_REVIEW_DEMO_USER: ${{ secrets.KRIA_BETA_REVIEW_DEMO_USER }}
          KRIA_BETA_REVIEW_DEMO_PASSWORD: ${{ secrets.KRIA_BETA_REVIEW_DEMO_PASSWORD }}
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          required=(
            KRIA_DEVELOPMENT_TEAM
            KRIA_PROVISIONING_PROFILE_SPECIFIER
            KRIA_GOOGLE_CLIENT_ID
            KRIA_GOOGLE_REDIRECT_SCHEME
            KRIA_TESTFLIGHT_GROUP
            KRIA_BETA_APP_DESCRIPTION
            KRIA_BETA_FEEDBACK_EMAIL
            KRIA_BETA_REVIEW_CONTACT_EMAIL
            KRIA_BETA_REVIEW_CONTACT_FIRST_NAME
            KRIA_BETA_REVIEW_CONTACT_LAST_NAME
            KRIA_BETA_REVIEW_CONTACT_PHONE
            KRIA_BETA_REVIEW_NOTES
            KRIA_BETA_REVIEW_DEMO_USER
            KRIA_BETA_REVIEW_DEMO_PASSWORD
            IOS_DISTRIBUTION_CERTIFICATE_BASE64
            IOS_DISTRIBUTION_CERTIFICATE_PASSWORD
            IOS_APP_STORE_PROVISIONING_PROFILE_BASE64
            SIGNING_KEYCHAIN_PASSWORD
            APP_STORE_CONNECT_API_KEY_ID
            APP_STORE_CONNECT_ISSUER_ID
            APP_STORE_CONNECT_API_KEY_BASE64
          )
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || { echo "::error::$name is not configured"; exit 2; }
          done

      - name: Configure Xcode
        if: steps.gate.outputs.eligible == 'true'
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Install XcodeGen
        if: steps.gate.outputs.eligible == 'true'
        run: brew install xcodegen

      - name: Install distribution signing assets
        if: steps.gate.outputs.eligible == 'true'
        env:
          IOS_DISTRIBUTION_CERTIFICATE_BASE64: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_BASE64 }}
          IOS_DISTRIBUTION_CERTIFICATE_PASSWORD: ${{ secrets.IOS_DISTRIBUTION_CERTIFICATE_PASSWORD }}
          IOS_APP_STORE_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_APP_STORE_PROVISIONING_PROFILE_BASE64 }}
          SIGNING_KEYCHAIN_PASSWORD: ${{ secrets.SIGNING_KEYCHAIN_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/kria-signing.keychain-db"
          certificate="$RUNNER_TEMP/kria-distribution.p12"
          profile="$RUNNER_TEMP/kria-app-store.mobileprovision"
          printf '%s' "$IOS_DISTRIBUTION_CERTIFICATE_BASE64" | python3 -c 'import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > "$certificate"
          printf '%s' "$IOS_APP_STORE_PROVISIONING_PROFILE_BASE64" | python3 -c 'import base64, sys; sys.stdout.buffer.write(base64.b64decode(sys.stdin.buffer.read()))' > "$profile"
          security create-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          security import "$certificate" -k "$keychain" -P "$IOS_DISTRIBUTION_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$SIGNING_KEYCHAIN_PASSWORD" "$keychain"
          security list-keychains -d user -s "$keychain"
          security find-identity -v -p codesigning "$keychain" | grep -q 'Apple Distribution'
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$profile" "$HOME/Library/MobileDevice/Provisioning Profiles/kria-app-store.mobileprovision"

      - name: Install pinned TestFlight client
        if: steps.gate.outputs.eligible == 'true'
        run: |
          set -euo pipefail
          gem install bundler:2.7.2 --no-document
          bundle _2.7.2_ config set --local path vendor/bundle
          bundle _2.7.2_ install --gemfile fastlane/Gemfile --jobs 4 --retry 3

      - name: Archive signed Release IPA
        if: steps.gate.outputs.eligible == 'true'
        env:
          KRIA_DEVELOPMENT_TEAM: ${{ vars.KRIA_DEVELOPMENT_TEAM }}
          KRIA_PROVISIONING_PROFILE_SPECIFIER: ${{ vars.KRIA_PROVISIONING_PROFILE_SPECIFIER }}
          KRIA_GOOGLE_CLIENT_ID: ${{ vars.KRIA_GOOGLE_CLIENT_ID }}
          KRIA_GOOGLE_REDIRECT_SCHEME: ${{ vars.KRIA_GOOGLE_REDIRECT_SCHEME }}
          KRIA_MARKETING_VERSION: 0.1.0
          KRIA_BUILD_NUMBER: ${{ github.run_number }}
          KRIA_ARCHIVE_PATH: ${{ runner.temp }}/Kria.xcarchive
          KRIA_EXPORT_PATH: ${{ runner.temp }}/testflight-export
        run: |
          set -euo pipefail
          bash scripts/ios/archive-testflight.sh | tee "$RUNNER_TEMP/kria-archive.log"
          ipa_path="$(sed -n 's/^KRIA_IPA_PATH=//p' "$RUNNER_TEMP/kria-archive.log")"
          [ -n "$ipa_path" ] || { echo '::error::archive did not return an IPA path'; exit 1; }
          echo "KRIA_IPA_PATH=$ipa_path" >> "$GITHUB_ENV"

      - name: Upload and distribute to external TestFlight
        if: steps.gate.outputs.eligible == 'true'
        env:
          KRIA_DEVELOPMENT_TEAM: ${{ vars.KRIA_DEVELOPMENT_TEAM }}
          KRIA_TESTFLIGHT_GROUP: ${{ vars.KRIA_TESTFLIGHT_GROUP }}
          KRIA_BETA_APP_DESCRIPTION: ${{ vars.KRIA_BETA_APP_DESCRIPTION }}
          KRIA_BETA_FEEDBACK_EMAIL: ${{ vars.KRIA_BETA_FEEDBACK_EMAIL }}
          KRIA_BETA_REVIEW_CONTACT_EMAIL: ${{ vars.KRIA_BETA_REVIEW_CONTACT_EMAIL }}
          KRIA_BETA_REVIEW_CONTACT_FIRST_NAME: ${{ vars.KRIA_BETA_REVIEW_CONTACT_FIRST_NAME }}
          KRIA_BETA_REVIEW_CONTACT_LAST_NAME: ${{ vars.KRIA_BETA_REVIEW_CONTACT_LAST_NAME }}
          KRIA_BETA_REVIEW_CONTACT_PHONE: ${{ vars.KRIA_BETA_REVIEW_CONTACT_PHONE }}
          KRIA_BETA_REVIEW_NOTES: ${{ vars.KRIA_BETA_REVIEW_NOTES }}
          KRIA_BETA_REVIEW_DEMO_USER: ${{ secrets.KRIA_BETA_REVIEW_DEMO_USER }}
          KRIA_BETA_REVIEW_DEMO_PASSWORD: ${{ secrets.KRIA_BETA_REVIEW_DEMO_PASSWORD }}
          KRIA_MARKETING_VERSION: 0.1.0
          KRIA_BUILD_NUMBER: ${{ github.run_number }}
          APP_STORE_CONNECT_API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_API_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: BUNDLE_GEMFILE=fastlane/Gemfile bundle _2.7.2_ exec fastlane ios testflight
