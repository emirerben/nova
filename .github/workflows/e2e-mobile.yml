name: Mobile E2E

on:
  pull_request:
    paths:
      - "src/apps/web/**"

jobs:
  mobile-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: pnpm/action-setup@v3
        with:
          version: 9
      - name: Get pnpm store directory
        id: pnpm-store
        run: echo "path=$(pnpm store path)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('src/apps/web/package.json') }}
          restore-keys: pnpm-store-${{ runner.os }}-
      - name: Install web dependencies
        working-directory: src/apps/web
        run: pnpm install --no-frozen-lockfile
      - name: Disable unused Chrome apt source
        run: sudo bash scripts/ci/disable-unused-chrome-apt-source.sh
      - name: Install Playwright Chromium
        working-directory: src/apps/web
        run: pnpm exec playwright install --with-deps chromium
      # TEMPORARY (PR #1200): same-VM A/B of the motion-preview benchmark.
      # Reverted before review; never merge this step.
      - name: "[TEMP A/B] motion-preview phased (main) vs interleaved (branch)"
        working-directory: src/apps/web
        continue-on-error: true
        run: |
          echo "nproc=$(nproc)"; lscpu | grep -E "Model name|Thread|Core|Socket" || true
          FIXTURE=src/app/dev-qa/motion-preview/MotionPreviewPerformanceFixture.tsx
          cp "$FIXTURE" /tmp/fixture.interleaved.tsx
          git fetch --depth=1 origin main
          git show "FETCH_HEAD:src/apps/web/$FIXTURE" > /tmp/fixture.phased.tsx
          for round in 1 2; do
            for variant in phased interleaved; do
              cp "/tmp/fixture.$variant.tsx" "$FIXTURE"
              echo "::group::A/B round $round $variant"
              pnpm exec playwright test e2e/motion-preview.spec.ts --project desktop-editor \
                --repeat-each 6 --retries 0 --reporter list 2>&1 | sed -u "s/^/[AB $variant] /" || true
              echo "::endgroup::"
            done
          done
          cp /tmp/fixture.interleaved.tsx "$FIXTURE"
          git diff --exit-code -- "$FIXTURE"
      - name: Run mobile Playwright tests
        working-directory: src/apps/web
        run: pnpm exec playwright test
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: src/apps/web/playwright-report
          if-no-files-found: ignore
