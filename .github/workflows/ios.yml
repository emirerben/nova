name: iOS

on:
  pull_request:
    branches: [main, dev]
    paths:
      - "src/apps/ios/**"
      - "src/apps/api/app/cli/kria_contracts.py"
      - "src/apps/api/app/config.py"
      - "src/apps/api/app/kria/**"
      - "src/apps/api/app/models.py"
      - "src/apps/api/app/routes/auth.py"
      - "src/apps/api/app/routes/creation_threads.py"
      - "src/apps/api/app/routes/generative_jobs.py"
      - "src/apps/api/app/routes/me.py"
      - "src/apps/api/app/routes/personas.py"
      - "src/apps/api/app/services/mobile_auth.py"
      - "src/apps/api/app/tasks/mobile_upload_cleanup.py"
      - "src/apps/api/app/migrations/versions/0100_mobile_identity_sessions.py"
      - "src/apps/api/app/worker.py"
      - "src/apps/api/tests/fixtures/kria_mobile.json"
      - "src/apps/api/tests/fixtures/kria_edit_recipe_v1.json"
      - "scripts/ios/**"
      - ".github/workflows/ios.yml"
  push:
    branches: [main]
    paths:
      - "src/apps/ios/**"
      - "src/apps/api/app/cli/kria_contracts.py"
      - "src/apps/api/app/config.py"
      - "src/apps/api/app/kria/**"
      - "src/apps/api/app/models.py"
      - "src/apps/api/app/routes/auth.py"
      - "src/apps/api/app/routes/creation_threads.py"
      - "src/apps/api/app/routes/generative_jobs.py"
      - "src/apps/api/app/routes/me.py"
      - "src/apps/api/app/routes/personas.py"
      - "src/apps/api/app/services/mobile_auth.py"
      - "src/apps/api/app/tasks/mobile_upload_cleanup.py"
      - "src/apps/api/app/migrations/versions/0100_mobile_identity_sessions.py"
      - "src/apps/api/app/worker.py"
      - "src/apps/api/tests/fixtures/kria_mobile.json"
      - "src/apps/api/tests/fixtures/kria_edit_recipe_v1.json"
      - "scripts/ios/**"
      - ".github/workflows/ios.yml"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/apps/api/pyproject.toml
      - name: Install contract generator dependencies
        working-directory: src/apps/api
        run: pip install -e .
      - name: Verify mobile OpenAPI and shared contracts
        working-directory: src/apps/api
        env:
          STORAGE_BUCKET: nova-test
          DATABASE_URL: postgresql://localhost/test
          REDIS_URL: redis://localhost:6379/0
          INTERNAL_API_KEY: test
        run: python -m app.cli.kria_contracts --check
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/SourcePackages
          key: ios-spm-${{ runner.os }}-${{ hashFiles('src/apps/ios/**/Package.resolved', 'src/apps/ios/**/Package.swift') }}
          restore-keys: ios-spm-${{ runner.os }}-
      - name: Generate, build, and test Kria
        run: bash scripts/ios/verify.sh
