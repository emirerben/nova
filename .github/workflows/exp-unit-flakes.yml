name: exp-unit-flakes
on:
  push:
    branches: [codex/exp-unit-flakes]
permissions:
  contents: read
env:
  RENDER: DeviceRenderExecutionTests DeviceRenderIntentRepairTests DeviceRenderSessionTests
  ATOMIC: NotificationAtomicSessionTests
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arm: [fix, main, main-92s]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Project and simulator
        run: |
          set -euo pipefail
          if [ "${{ matrix.arm }}" != "fix" ]; then
            git checkout "$(git merge-base HEAD origin/main)" -- src/apps/ios/Kria/Core/DeviceRenderSessions.swift src/apps/ios/Tests/KriaTests
          fi
          bash scripts/ios/generate-project.sh
          SIM=$(xcrun simctl list devices available -j | /usr/bin/python3 scripts/exp-select-sim.py)
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
      - name: The session class once per call, 30 calls, with 6 busy processes (${{ matrix.arm }})
        if: ${{ matrix.arm != 'main-92s' }}
        run: bash scripts/exp-class-loop.sh ${{ matrix.arm }}-loop 30 6 NotificationAtomicSessionTests
      - name: Main, the one test that hit the 2-minute limit in the fix arm's whole suite (CI's unit job skips it)
        if: ${{ matrix.arm == 'main-92s' }}
        run: bash scripts/exp-unit.sh main-92s 1 0 SlidePostVideoRenderTests/testNinetyTwoSecondSourceTrimsVideoAndAudioAtNinetySeconds
      - uses: actions/upload-artifact@v4
        if: ${{ always() }}
        with:
          name: unit-logs-${{ matrix.arm }}
          path: src/apps/ios/*.log
          retention-days: 3
