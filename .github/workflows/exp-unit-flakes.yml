name: exp-unit-flakes
on:
  push:
    branches: [codex/exp-unit-flakes]
permissions:
  contents: read
env:
  RENDER: DeviceRenderExecutionTests DeviceRenderIntentRepairTests DeviceRenderSessionTests
  ATOMIC: NotificationAtomicSessionTests
jobs:
  compare:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - run: brew install xcodegen
      - name: Project and simulator
        run: |
          set -euo pipefail
          bash scripts/ios/generate-project.sh
          SIM=$(xcrun simctl list devices available -j | /usr/bin/python3 scripts/exp-select-sim.py)
          echo "SIM=$SIM" >> "$GITHUB_ENV"
          xcrun simctl boot "$SIM" || true
      - name: Fixes, the whole unit suite once, naming any test that hits the time limit
        if: ${{ !cancelled() }}
        run: bash scripts/exp-unit.sh fix-suite 1 0
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: unit-logs
          path: src/apps/ios/*.log
          retention-days: 3
