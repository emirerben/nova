name: Font registry mirror check

on: pull_request

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: node src/apps/web/scripts/sync-font-registry.mjs --check
