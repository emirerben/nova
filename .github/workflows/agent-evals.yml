name: Agent evals

permissions:
  contents: read

# Two triggers:
#   - `pull_request` (paths-filtered): runs the structural-only suite on every
#     PR that touches prompt files, agent code, or the eval harness itself.
#     No secrets needed; ~30s. This is the prompt-regression guardrail.
#   - `workflow_dispatch` (manual): paid live evals only for a prompt, model,
#     provider, or structured-output change. Every run is attributed and capped.
#   - weekly schedule: one fixture provider smoke, hard-capped at $0.20.
on:
  schedule:
    - cron: "17 8 * * 1"
  workflow_dispatch:
    inputs:
      agent:
        description: "Which agent to eval (all / Big-3 / Phase-2 in-pipeline)"
        required: false
        default: "clip_metadata"
        type: choice
        options:
          - all
          - template_recipe
          - clip_metadata
          - creative_direction
          - transcript
          - platform_copy
          - audio_template
      change_type:
        description: "Why is a paid full eval required?"
        required: true
        default: "prompt"
        type: choice
        options:
          - prompt
          - model
          - provider
          - structured_output

  pull_request:
    branches: [main, dev]
    paths:
      - "src/apps/api/prompts/**"
      - "src/apps/api/app/agents/**"
      - "src/apps/api/tests/evals/**"
      - "src/apps/api/tests/fixtures/agent_evals/**"
      - ".github/workflows/agent-evals.yml"

jobs:
  structural:
    name: Structural evals (PR guardrail)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        working-directory: src/apps/api
        run: pip install -e ".[dev]"

      - name: Run structural evals
        working-directory: src/apps/api
        # Default mode: replay + structural-only. No API keys needed.
        # Fork PRs can run this — `secrets.*` are not referenced.
        run: pytest tests/evals/ -v

  eval:
    name: Paid provider eval
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'schedule' && 'paid-ai-smoke' || 'paid-ai-evals' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install API dependencies
        working-directory: src/apps/api
        run: pip install -e ".[dev]"

      - name: Validate paid eval reason against the selected ref
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin main
          range="origin/main...HEAD"
          if git diff --quiet "$range"; then
            range="HEAD^..HEAD"
          fi
          changed="$(git diff --name-only "$range")"
          diff="$(git diff --unified=0 "$range")"
          valid=false
          case "${{ inputs.change_type }}" in
            prompt)
              if grep -Eq '^src/apps/api/prompts/' <<<"$changed" || grep -Eq 'render_prompt' <<<"$diff"; then valid=true; fi ;;
            model)
              if grep -Eq '^[+-].*(model[=:]|_MODEL|MODEL=|gemini-)' <<<"$diff"; then valid=true; fi ;;
            provider)
              if grep -Eq '^src/apps/api/app/(agents/_model_client\.py|services/ai_cost_control\.py|services/[^/]*provider[^/]*\.py)$|^src/apps/api/pyproject\.toml$' <<<"$changed"; then valid=true; fi ;;
            structured_output)
              if grep -Eq '^src/apps/api/app/agents/_schemas/' <<<"$changed" || grep -Eq '^[+-].*(BaseModel|Output\(|response_schema)' <<<"$diff"; then valid=true; fi ;;
          esac
          if [ "$valid" != true ]; then
            echo "Selected paid-eval reason '${{ inputs.change_type }}' is not supported by the diff in $range." >&2
            exit 1
          fi

      - name: Pick test target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "path=tests/evals/test_song_classifier_evals.py -k baseline_track" >> "$GITHUB_OUTPUT"
            echo "purpose=provider_smoke" >> "$GITHUB_OUTPUT"
            echo "cap=0.20" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          case "${{ inputs.agent }}" in
            template_recipe)
              echo "path=tests/evals/test_template_recipe_evals.py" >> "$GITHUB_OUTPUT" ;;
            clip_metadata)
              echo "path=tests/evals/test_clip_metadata_evals.py" >> "$GITHUB_OUTPUT" ;;
            creative_direction)
              echo "path=tests/evals/test_creative_direction_evals.py" >> "$GITHUB_OUTPUT" ;;
            transcript)
              echo "path=tests/evals/test_transcript_evals.py" >> "$GITHUB_OUTPUT" ;;
            platform_copy)
              echo "path=tests/evals/test_platform_copy_evals.py" >> "$GITHUB_OUTPUT" ;;
            audio_template)
              echo "path=tests/evals/test_audio_template_evals.py" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "path=tests/evals/" >> "$GITHUB_OUTPUT" ;;
          esac
          echo "purpose=live_eval" >> "$GITHUB_OUTPUT"
          echo "cap=2.00" >> "$GITHUB_OUTPUT"

      - name: Run live agent evals
        working-directory: src/apps/api
        env:
          NOVA_EVAL_MODE: live
          NOVA_EVAL_CAPTURE_DIR: .dev/live-eval-captures
          NOVA_PAID_AI_WORKFLOW: "1"
          AI_COST_CONTROL_ENABLED: "true"
          AI_USAGE_ENVIRONMENT: development
          # Protected-environment secret for the persistent development
          # authority used by manual QA and live evals. Ephemeral databases
          # would each mint a fresh monthly allowance.
          DATABASE_URL: ${{ secrets.DATABASE_URL_DEV }}
          REDIS_URL: redis://localhost:6379
          STORAGE_BUCKET: nova-test
          STORAGE_PROVIDER: gcs
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_DEV }}
        run: |
          python -m alembic current --check-heads
          pytest ${{ steps.target.outputs.path }} -v \
            --eval-mode=live \
            --usage-purpose=${{ steps.target.outputs.purpose }} \
            --test-run-id=github-${{ github.run_id }}-${{ github.run_attempt }} \
            --max-cost-usd=${{ steps.target.outputs.cap }} \
            --approve-reservation

      - name: Store paid responses as replay captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: replay-captures-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/apps/api/.dev/live-eval-captures/
          if-no-files-found: ignore
          retention-days: 30
